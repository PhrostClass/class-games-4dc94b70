<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Class Games</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Class Games">
<meta name="theme-color" content="#5b4bdb">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<style>
:root{
  --bg:#f2f2f7; --card:#ffffff; --card2:#f7f7fa; --text:#111118; --muted:#6e6e78; --line:#e4e4ea;
  --accent:#5b4bdb; --accent2:#7c6cf0; --on-accent:#fff;
  --ok:#22a06b; --warn:#f59e0b; --bad:#e5484d;
  --sa-t:env(safe-area-inset-top,0px); --sa-b:env(safe-area-inset-bottom,0px);
  --sa-l:env(safe-area-inset-left,0px); --sa-r:env(safe-area-inset-right,0px);
  --radius:16px; --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
:root[data-theme="dark"]{
  --bg:#0f0f14; --card:#1c1c24; --card2:#24242e; --text:#f3f3f8; --muted:#9a9aa8; --line:#2c2c38;
  --accent:#8b7cf6; --accent2:#a597ff;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0f0f14; --card:#1c1c24; --card2:#24242e; --text:#f3f3f8; --muted:#9a9aa8; --line:#2c2c38;
    --accent:#8b7cf6; --accent2:#a597ff;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:var(--font);
  -webkit-text-size-adjust:100%;overscroll-behavior:none;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
input,textarea{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}
#app{position:fixed;inset:0;display:flex;flex-direction:column;overflow:hidden}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;overflow:hidden;background:var(--bg)}
.topbar{flex:0 0 auto;display:flex;align-items:center;gap:8px;min-height:52px;
  padding:calc(var(--sa-t) + 6px) calc(var(--sa-r) + 10px) 6px calc(var(--sa-l) + 10px);
  background:var(--bg);border-bottom:1px solid var(--line)}
.topbar h1{flex:1;font-size:19px;font-weight:700;margin:0;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .side{flex:0 0 84px;display:flex;align-items:center}
.topbar .side.r{justify-content:flex-end}
.tbtn{background:none;border:0;color:var(--accent);font:inherit;font-size:17px;font-weight:600;padding:8px 6px;border-radius:10px;min-height:44px;cursor:pointer;white-space:nowrap}
.tbtn:active{opacity:.5}
.content{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px calc(var(--sa-r) + 14px) calc(var(--sa-b) + 24px) calc(var(--sa-l) + 14px)}
.wrap{max-width:720px;margin:0 auto;width:100%}
h2.sec{font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:22px 4px 8px}
.card{background:var(--card);border-radius:var(--radius);overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.row{display:flex;align-items:center;gap:12px;padding:13px 16px;min-height:54px;border-bottom:1px solid var(--line);cursor:pointer;background:var(--card)}
.row:last-child{border-bottom:0}
.row:active{background:var(--card2)}
.row .ic{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;background:var(--card2);flex:0 0 36px}
.row .txt{flex:1;min-width:0}
.row .t{font-size:17px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s{font-size:13px;color:var(--muted);margin-top:2px}
.row .chev{color:var(--muted);font-size:20px;opacity:.6}
.row.static{cursor:default}.row.static:active{background:var(--card)}
.folderhead{display:flex;align-items:center;gap:8px;padding:10px 4px 8px;margin-top:18px}
.folderhead .tri{width:30px;text-align:left;font-size:15px;color:var(--muted)}
.folderhead .name{flex:1;font-size:16px;font-weight:700;cursor:pointer}
.folderhead .cnt{color:var(--muted);font-size:13px}
.folderhead .tbtn{font-size:15px;padding:6px 8px;min-height:36px}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:15px 18px;font:inherit;font-size:17px;font-weight:600;
  background:var(--accent);color:var(--on-accent);cursor:pointer;text-align:center}
.btn:active{filter:brightness(.9)}
.btn.sec{background:var(--card);color:var(--accent);border:1px solid var(--line)}
.btn.bad{background:var(--card);color:var(--bad);border:1px solid var(--line)}
.btn.ok{background:var(--ok)}
.btn.big{font-size:20px;padding:20px}
.btn[disabled]{opacity:.45;pointer-events:none}
.btnrow{display:flex;gap:10px}
.btnrow .btn{flex:1;padding-left:8px;padding-right:8px}
.field{padding:12px 16px;border-bottom:1px solid var(--line);background:var(--card)}
.field:last-child{border-bottom:0}
.field label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
.field input[type=text],.field select,.field textarea{width:100%;border:0;background:transparent;color:var(--text);font:inherit;font-size:17px;padding:4px 0;outline:none}
.field textarea{min-height:220px;resize:vertical;line-height:1.45;font-size:17px}
.field select{-webkit-appearance:none;appearance:none}
.hint{font-size:13px;color:var(--muted);margin:8px 4px 0;line-height:1.4}
.chips{display:flex;flex-wrap:wrap;gap:8px;padding:12px 4px}
.chip{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:7px 13px;font-size:15px}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;min-height:54px;border-bottom:1px solid var(--line);background:var(--card);cursor:pointer}
.toggle:last-child{border-bottom:0}
.toggle .lbl{font-size:17px}
.toggle .sub{font-size:13px;color:var(--muted);margin-top:2px}
.sw{width:51px;height:31px;border-radius:16px;background:#c9c9d1;position:relative;transition:background .2s;flex:0 0 51px}
:root[data-theme="dark"] .sw{background:#3a3a46}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .sw{background:#3a3a46}}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.25);transition:transform .2s}
.sw.on{background:var(--ok)!important}.sw.on::after{transform:translateX(20px)}
.seg{display:flex;background:var(--card2);border-radius:12px;padding:3px;gap:2px;border:1px solid var(--line)}
.seg button{flex:1;border:0;background:transparent;color:var(--text);font:inherit;font-size:15px;font-weight:600;padding:10px 4px;border-radius:10px;cursor:pointer;min-height:40px}
.seg button.on{background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.stepper{display:flex;align-items:center;gap:0;background:var(--card2);border-radius:10px}
.stepper button{width:44px;height:38px;border:0;background:transparent;color:var(--accent);font-size:22px;font-weight:600;cursor:pointer}
.stepper span{min-width:28px;text-align:center;font-weight:700;font-size:17px}
.check{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);flex:0 0 26px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:15px}
.check.on{background:var(--accent);border-color:var(--accent)}
.empty{padding:40px 20px;text-align:center;color:var(--muted);font-size:15px;line-height:1.5}
.empty .big{font-size:44px;margin-bottom:10px}
.games{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.gcard{background:var(--card);border-radius:20px;padding:22px 20px;min-height:150px;display:flex;flex-direction:column;justify-content:flex-end;cursor:pointer;position:relative;overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.gcard:active{transform:scale(.98)}
.gcard .emoji{font-size:44px;position:absolute;top:16px;right:18px}
.gcard .n{font-size:22px;font-weight:800}
.gcard .d{font-size:14px;color:var(--muted);margin-top:4px}
.gcard.soon{opacity:.55;cursor:default}
.gcard.charades{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff}
.gcard.charades .d{color:rgba(255,255,255,.85)}
.hero{padding:calc(var(--sa-t) + 26px) 20px 18px;text-align:center}
.hero .title{font-size:34px;font-weight:800;letter-spacing:-.02em}
.hero .sub{color:var(--muted);font-size:15px;margin-top:4px}
/* modal / sheet */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:50;animation:fade .15s}
@media (min-width:600px){.modal{align-items:center;padding:20px}}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:calc(100% - var(--sa-t) - 20px);border-radius:22px 22px 0 0;padding:14px 16px calc(var(--sa-b) + 16px);overflow-y:auto;animation:up .2s}
@media (min-width:600px){.sheet{border-radius:22px;padding-bottom:16px}}
.sheet h3{margin:4px 0 12px;font-size:20px;text-align:center}
.sheet p{margin:0 0 16px;text-align:center;color:var(--muted);font-size:15px;line-height:1.45}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(30px)}}
.toast{position:fixed;left:50%;bottom:calc(var(--sa-b) + 26px);transform:translateX(-50%);background:#222;color:#fff;padding:11px 18px;border-radius:999px;font-size:15px;z-index:60;box-shadow:0 4px 16px rgba(0,0,0,.3);max-width:88%;text-align:center;animation:fade .2s}
/* play */
.play{background:var(--accent);color:#fff;position:absolute;inset:0;display:flex;flex-direction:column;overflow:hidden;
  padding:var(--sa-t) var(--sa-r) var(--sa-b) var(--sa-l);transition:background .12s}
.play.ready{background:#1f1f2b}
.play.good{background:var(--ok)}
.play.pass{background:var(--warn)}
.play .ptop{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;font-size:16px;font-weight:600}
.play .ptop button{background:rgba(255,255,255,.18);border:0;color:#fff;font:inherit;font-size:15px;font-weight:600;padding:9px 14px;border-radius:999px;min-height:40px;cursor:pointer}
.play .timerbar{height:6px;background:rgba(255,255,255,.25);margin:0 14px;border-radius:3px;overflow:hidden}
.play .timerbar i{display:block;height:100%;background:#fff;width:100%;transition:width .2s linear}
.play .timerbar.hot i{background:#ffd166}
.play .clock{font-variant-numeric:tabular-nums;font-size:22px;font-weight:800;min-width:60px;text-align:center}
.play .word{flex:1;display:flex;align-items:center;justify-content:center;text-align:center;padding:10px 24px;font-weight:800;line-height:1.08;word-break:break-word;letter-spacing:-.01em;min-height:0}
.play .word span{display:block;width:100%}
.play .sub{text-align:center;opacity:.8;font-size:16px;padding:0 20px 8px}
.play .actions{display:flex;gap:14px;padding:10px 16px 18px}
.play .actions button{flex:1;border:0;border-radius:22px;padding:22px 10px;font:inherit;font-size:24px;font-weight:800;cursor:pointer;min-height:96px;color:#fff}
.play .actions .p{background:rgba(0,0,0,.28)}
.play .actions .g{background:rgba(255,255,255,.22)}
.play .actions button:active{transform:scale(.97)}
.play .center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;overflow-y:auto}
.play .center .h{font-size:34px;font-weight:800;margin-bottom:8px}
.play .center .t{font-size:18px;opacity:.85;line-height:1.5;max-width:520px}
.play .center .count{font-size:140px;font-weight:900;line-height:1}
.play .pbtn{background:#fff;color:#1f1f2b;border:0;border-radius:16px;padding:18px 34px;font:inherit;font-size:20px;font-weight:700;margin-top:22px;cursor:pointer;min-width:220px}
.play .pbtn.ghost{background:rgba(255,255,255,.14);color:#fff}
.play .pbtn:active{filter:brightness(.9)}
.play .results{flex:1;overflow-y:auto;padding:0 16px;width:100%;max-width:640px;margin:0 auto}
.play .rlist{background:rgba(255,255,255,.12);border-radius:14px;padding:6px 0;margin:10px 0}
.play .rlist div{padding:8px 14px;font-size:17px;display:flex;justify-content:space-between}
.play .rlist div + div{border-top:1px solid rgba(255,255,255,.1)}
.play .score{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:8px 0 10px}
.play .score>div{background:rgba(255,255,255,.14);border-radius:14px;padding:12px 18px;min-width:120px;text-align:center}
.play .score>div.lead{background:#fff;color:#1f1f2b}
.play .score .n{font-size:14px;opacity:.85}.play .score .v{font-size:30px;font-weight:900}
.play .resacts{display:flex;gap:10px;padding:12px 16px 12px;width:100%;max-width:640px;margin:0 auto}
.play .resacts .pbtn{flex:1;margin:0;min-width:0;padding:16px 10px;font-size:18px}
@media (orientation:landscape) and (max-height:520px){
  .play .actions button{min-height:70px;padding:14px;font-size:20px}
  .play .center .h{font-size:26px}.play .center .count{font-size:100px}
}
/* extra game cards */
.gcard.buzz{background:linear-gradient(135deg,#0f9d6e,#22c78e);color:#fff}.gcard.buzz .d{color:rgba(255,255,255,.85)}
.gcard.futaba{background:linear-gradient(135deg,#e8621a,#f5a524);color:#fff}.gcard.futaba .d{color:rgba(255,255,255,.85)}
.gcard.memory{background:linear-gradient(135deg,#c2338f,#ef5b7a);color:#fff}.gcard.memory .d{color:rgba(255,255,255,.85)}
.chip .pair{color:var(--muted)}
.seg.wrap{flex-wrap:wrap}.seg.wrap button{flex:1 1 30%;min-width:90px}
.play .pbtn.small{padding:10px 20px;font-size:16px;min-width:0;margin-top:10px}
/* buzz monster */
.play.bz .score{margin:4px 10px}
.bboard{flex:1;display:grid;gap:8px;padding:6px 14px 14px;grid-auto-rows:minmax(0,1fr);min-height:0}
.bhead{display:flex;align-items:center;justify-content:center;text-align:center;font-weight:800;font-size:clamp(12px,1.8vw,20px);background:rgba(255,255,255,.12);border-radius:12px;padding:6px;line-height:1.15;overflow:hidden}
.bcell{border:0;border-radius:14px;background:#fff;color:#1f1f2b;font:inherit;font-weight:900;font-size:clamp(18px,3vw,40px);cursor:pointer;min-height:0}
.bcell:active{transform:scale(.96)}
.bcell.done{background:rgba(255,255,255,.12);color:#fff;font-size:clamp(18px,3vw,36px);cursor:default}
.bcard{position:absolute;inset:0;background:var(--accent);color:#fff;display:flex;flex-direction:column;animation:fade .15s;padding:var(--sa-t) var(--sa-r) var(--sa-b) var(--sa-l)}
.bcard-face{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:16px;min-height:0}
.bcat{font-size:18px;font-weight:700;opacity:.85;margin-bottom:6px}
.bword{flex:1;display:flex;align-items:center;justify-content:center;font-weight:800;line-height:1.08;width:100%;min-height:0;padding:0 20px;word-break:break-word}
.bword span{display:block;width:100%}
.banswer{font-size:clamp(20px,3.5vw,34px);font-weight:700;background:rgba(0,0,0,.2);padding:10px 22px;border-radius:14px;margin-top:8px}
.bjudge{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:14px}
.bjudge .pbtn{margin:0;min-width:160px;padding:16px 22px;font-size:18px}
.bjudge.full{flex-wrap:nowrap;gap:8px;padding:0 10px calc(var(--sa-b) + 10px);margin:0;width:100%}
.bjudge.full .pbtn{flex:1;min-width:0;padding:22px 6px;font-size:clamp(15px,2vw,22px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:80px}
.bcard .t{font-size:20px;opacity:.9}
.tqgroup{background:#ffd166;color:#1f1f2b;padding:4px 12px;border-radius:999px;font-weight:800}
.play.bz .timerbar{margin:2px 14px 6px}
/* futaba */
.play.fut{background:#1f1f2b;touch-action:none}
.fcenter{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:flex;gap:8px;align-items:center;font-weight:700;font-size:16px;z-index:2;white-space:nowrap}
.fcenter button{background:rgba(255,255,255,.14);border:0;color:#fff;font:inherit;font-size:15px;font-weight:600;padding:9px 14px;border-radius:999px;min-height:40px;cursor:pointer}
.fpanel{position:absolute;background:var(--card);color:var(--text);border-radius:18px;border:4px solid #fff;display:flex;flex-direction:column;padding:8px 12px 10px;gap:6px;transform-origin:center;box-sizing:border-box;transition:box-shadow .15s}
.fpanel.locked{opacity:.45}
.fpanel.won{box-shadow:0 0 0 6px var(--ok)}
.fpanel.second{box-shadow:0 0 0 6px #c0c0c0}
.fpanel.small{padding:6px 8px 8px;gap:4px}
.fpanel.small .fopt{font-size:clamp(12px,1.4vw,18px);padding:2px 6px;overflow-wrap:normal;word-break:keep-all;line-height:1.15}
.fpanel.small .fprompt{font-size:clamp(14px,1.8vw,22px)}
.fhead .delta{font-style:normal;font-weight:800;margin-right:8px;padding:1px 7px;border-radius:999px;color:#fff}
.fhead .delta.up{background:var(--ok)}.fhead .delta.down{background:var(--bad)}
.fhead{display:flex;justify-content:space-between;font-size:14px;color:var(--muted)}
.fhead b{color:var(--text);font-size:16px}
.fprompt{text-align:center;font-weight:800;font-size:clamp(16px,2.2vw,26px);line-height:1.1;overflow:hidden;max-height:2.3em}
.fopts{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:8px;min-height:0}
.fopts.cols-3{grid-template-columns:1fr 1fr 1fr}
.fopt{border:0;border-radius:12px;background:var(--card2);color:var(--text);font:inherit;font-weight:700;font-size:clamp(14px,1.8vw,22px);padding:4px 8px;cursor:pointer;min-height:0;overflow:hidden;overflow-wrap:normal;word-break:keep-all;line-height:1.15;touch-action:none;-webkit-user-select:none;user-select:none}
.fopt:active{filter:brightness(.9)}
.fopt.right{background:var(--ok);color:#fff}
.fopt.wrong{background:var(--bad);color:#fff}
/* memory */
.play.mm .score{margin:4px 10px}
.mboard{flex:1;display:grid;gap:10px;padding:8px 14px 14px;grid-auto-rows:minmax(0,1fr);min-height:0}
.mcard{position:relative;perspective:800px;cursor:pointer;min-height:0}
.mface{position:absolute;inset:0;border-radius:14px;display:flex;align-items:center;justify-content:center;backface-visibility:hidden;-webkit-backface-visibility:hidden;transition:transform .35s;font-weight:800;padding:6px;text-align:center;overflow:hidden}
.mface.back{background:var(--accent);color:#fff;font-size:clamp(20px,4vw,48px);background-image:linear-gradient(135deg,rgba(255,255,255,.18),transparent)}
.mface.front{background:#fff;color:#1f1f2b;transform:rotateY(180deg);overflow-wrap:anywhere;line-height:1.1}
.mcard.up .back{transform:rotateY(180deg)}
.mcard.up .front{transform:rotateY(0deg)}
.mcard.done{cursor:default}
.mcard.done .front{background:#e8fff3;box-shadow:inset 0 0 0 5px var(--tc,#22a06b)}
/* queue */
.gcard.queue{background:linear-gradient(135deg,#1e6fd9,#4f9cf7);color:#fff}.gcard.queue .d{color:rgba(255,255,255,.85)}
.qgroups{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.qgcard{background:var(--card);border-radius:18px;padding:18px 14px;text-align:center;cursor:pointer;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.qgcard:active{transform:scale(.97)}
.qgicon{font-size:42px}.qgname{font-size:18px;font-weight:800;margin-top:6px}.qgsub{font-size:13px;color:var(--muted);margin-top:2px}.qgcount{font-size:13px;color:var(--muted);margin-top:6px}
.qbody{flex:1;display:flex;gap:12px;padding:10px calc(var(--sa-r) + 12px) calc(var(--sa-b) + 12px) calc(var(--sa-l) + 12px);min-height:0}
.qgrid{flex:1;display:grid;gap:10px;grid-auto-rows:minmax(0,1fr);min-height:0;min-width:0;overflow:auto}
.qcard{background:var(--card);border:3px solid transparent;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;position:relative;min-height:0;padding:6px;-webkit-user-select:none;user-select:none}
.qcard:active{transform:scale(.96)}
.qcard.inq{border-color:var(--ok);background:#e9fbf3;color:#1f1f2b}
.qcard.now{border-color:var(--warn)}

  { id: 'preset_characters', name: 'Characters & stories', emoji: '🦸', words: ['Spider-Man','Harry Potter','Elsa','Batman','Mario','Pikachu','Shrek','Santa Claus','Cinderella','Superman','a pirate','a vampire','a zombie','a robot','a witch','a ghost','a princess','a knight','a dragon','a mermaid','a cowboy','a ninja','an alien','Minions','Peppa Pig','Sonic','Buzz Lightyear','a wizard','Frankenstein','a giant'] },
  { id: 'preset_house', name: 'At home', emoji: '🏠', words: ['bed','sofa','fridge','oven','television','lamp','mirror','toilet','shower','bath','washing machine','vacuum cleaner','microwave','iron','kettle','pillow','blanket','stairs','garden','garage','key','remote control','toothbrush','hairdryer','alarm clock','curtains','wardrobe','bookshelf','frying pan','broom'] },
  { id: 'preset_holidays', name: 'Halloween & Christmas', emoji: '🎃', words: ['pumpkin','skeleton','witch','vampire','ghost','spider web','bat','haunted house','trick or treat','mummy','black cat','Santa Claus','reindeer','snowman','Christmas tree','present','elf','sleigh','stocking','candy cane','gingerbread man','fireplace','chimney','snowball fight','carol singers','turkey','crackers','mistletoe','angel','star'] },
];
const PRESET_FOLDER = { id: 'preset', name: 'Preset decks' };

/* ===================== Store ===================== */
const DEFAULT_SETTINGS = { roundSeconds: 60, allowPass: true, avoidRepeats: true, sound: true, tilt: true, showPresets: true, theme: 'auto', teams: 1, teamNames: ['Team 1', 'Team 2', 'Team 3', 'Team 4'], lastDecks: [], collapsed: {} };
let db;
function freshDb() { return { v: 1, folders: [], decks: [], turnQuestions: [], settings: JSON.parse(JSON.stringify(DEFAULT_SETTINGS)) }; }
function normalizeDb(d) {
  if (!d || typeof d !== 'object') return freshDb();
  d.v = 1;
  d.folders = Array.isArray(d.folders) ? d.folders.filter(f => f && f.id && typeof f.name === 'string').map(f => ({ id: String(f.id), name: f.name })) : [];
  d.decks = Array.isArray(d.decks) ? d.decks.filter(k => k && k.id && typeof k.name === 'string').map(k => ({
    id: String(k.id), name: k.name, folderId: k.folderId ? String(k.folderId) : null,
    words: cleanWords(Array.isArray(k.words) ? k.words : []),
    created: k.created || Date.now(), updated: k.updated || Date.now(),
  })) : [];
  d.turnQuestions = Array.isArray(d.turnQuestions) ? cleanWords(d.turnQuestions) : [];
  d.queue = normalizeQueue(d.queue);
  const folderIds = new Set(d.folders.map(f => f.id));
  d.decks.forEach(k => { if (k.folderId && !folderIds.has(k.folderId)) k.folderId = null; });
  d.settings = { ...JSON.parse(JSON.stringify(DEFAULT_SETTINGS)), ...(d.settings || {}) };
  if (!Array.isArray(d.settings.teamNames)) d.settings.teamNames = [...DEFAULT_SETTINGS.teamNames];
  while (d.settings.teamNames.length < 6) d.settings.teamNames.push('Team ' + (d.settings.teamNames.length + 1));
  if (!Array.isArray(d.settings.lastDecks)) d.settings.lastDecks = [];
  if (!d.settings.collapsed || typeof d.settings.collapsed !== 'object') d.settings.collapsed = {};
  return d;
}
function loadDb() {
  try { const raw = localStorage.getItem(LS_KEY); if (raw) return normalizeDb(JSON.parse(raw)); } catch (e) { console.warn('load failed', e); }
  return normalizeDb(freshDb());
}
function saveDb() {
  db.savedAt = Date.now();
  try { localStorage.setItem(LS_KEY, JSON.stringify(db)); } catch (e) { toast('Could not save: ' + e.message); }
}
function cleanWords(arr) {
  const seen = new Set(); const out = [];
  for (let w of arr) {
    w = String(w ?? '').replace(/\s+/g, ' ').trim();
    if (!w) continue;
    const k = w.toLowerCase();
    if (seen.has(k)) continue;
    seen.add(k); out.push(w);
  }
  return out;
}
/* An entry is "term" or "term | answer" or "term | answer | extra" (pairs are used by Futaba and Memory). */
const PAIR_SEP = /\s*\|\s*|\t+|\s+=\s+|\s+[-–—]\s+|\s+:\s+/;
const parts = w => String(w ?? '').split(PAIR_SEP).map(s => s.trim()).filter(Boolean);
const term = w => parts(w)[0] || '';
const hasPair = w => parts(w).length > 1;
const stripLine = p => String(p).trim().replace(/^(?:[-*•]|\d+[.)])\s*/, '').replace(/^["']|["']$/g, '').trim();
/* Parse free text into entries: one per line; commas/semicolons split a line into several words unless the
   line is a pair ("dog | perro", "dog<tab>perro", "dog = perro", "dog - perro"); "1. " or "- " prefixes are removed. */
function parseWords(text, opts = {}) {
  const lines = String(text || '').split(/\r?\n/);
  const out = [];
  for (let line of lines) {
    line = stripLine(line);
    if (!line) continue;
    let ps = line.split(PAIR_SEP).map(stripLine).filter(Boolean);
    if (ps.length > 1) { out.push(ps.slice(0, 3).join(' | ')); continue; }
    if (/[,;]/.test(line)) {
      ps = line.split(/[,;]/).map(stripLine).filter(Boolean);
      if (opts.csvPairs && ps.length > 1) out.push(ps.slice(0, 3).join(' | ')); else ps.forEach(p => out.push(p));
    } else out.push(line);
  }
  return cleanWords(out);
}
function scramble(word) {
  const one = w => { if (w.length < 3) return w; for (let t = 0; t < 10; t++) { const s = shuffle(w.split('')).join(''); if (s.toLowerCase() !== w.toLowerCase()) return s; } return w.split('').reverse().join(''); };
  return String(word).split(' ').map(one).join(' ');
}
function gapped(word) {
  const w = String(word); const idx = []; for (let i = 0; i < w.length; i++) if (/[a-z0-9À-ɏ]/i.test(w[i])) idx.push(i);
  const n = Math.max(1, Math.round(idx.length * 0.4)); const hide = new Set(shuffle(idx.slice()).slice(0, n));
  return w.split('').map((c, i) => hide.has(i) ? '_' : c).join('');
}
const plural = (n, s) => n + ' ' + s + (n === 1 ? '' : 's');
const allDecks = () => db.settings.showPresets ? db.decks.concat(PRESET_DECKS) : db.decks;
const getDeck = id => db.decks.find(k => k.id === id) || PRESET_DECKS.find(k => k.id === id) || null;
const isPreset = k => !!(k && k.id && String(k.id).startsWith('preset_'));
const getFolder = id => id === 'preset' ? PRESET_FOLDER : db.folders.find(f => f.id === id) || null;
const sortByName = a => a.slice().sort((x, y) => x.name.localeCompare(y.name, undefined, { sensitivity: 'base' }));
function foldersSorted() { return sortByName(db.folders); }
function decksInFolder(fid) { return sortByName(db.decks.filter(k => (k.folderId || null) === (fid || null))); }
function addFolder(name) { const f = { id: uid(), name: String(name).trim() || 'Folder' }; db.folders.push(f); saveDb(); return f; }
function upsertDeck(d) {
  const i = db.decks.findIndex(k => k.id === d.id);
  d.updated = Date.now();
  if (i >= 0) db.decks[i] = d; else { d.created = d.created || Date.now(); db.decks.push(d); }
  saveDb(); return d;
}
function deleteDeck(id) { db.decks = db.decks.filter(k => k.id !== id); db.settings.lastDecks = db.settings.lastDecks.filter(x => x !== id); saveDb(); }
function deleteFolder(id) { db.decks.forEach(k => { if (k.folderId === id) k.folderId = null; }); db.folders = db.folders.filter(f => f.id !== id); saveDb(); }
function uniqueName(name, exceptId) {
  let n = name, i = 2;
  const taken = () => allDecks().some(k => k.id !== exceptId && k.name.toLowerCase() === n.toLowerCase());
  while (taken()) n = `${name} (${i++})`;
  return n;
}
/* Import: returns {kind:'backup', data} | {kind:'decks', decks:[{name,words,folderName?}]} | {kind:'words', words, name} */
function detectImport(text, fileName) {
  const t = String(text || '').trim();
  const baseName = (fileName || '').replace(/\.[^.]+$/, '').trim();
  if (t.startsWith('{') || t.startsWith('[')) {
    try {
      const j = JSON.parse(t);
      if (j && Array.isArray(j.decks) && (Array.isArray(j.folders) || j.v)) return { kind: 'backup', data: normalizeDb(JSON.parse(t)) };
      if (Array.isArray(j)) {
        if (j.every(x => typeof x === 'string')) return { kind: 'words', words: cleanWords(j), name: baseName };
        const decks = j.filter(x => x && Array.isArray(x.words)).map(x => ({ name: String(x.name || baseName || 'Imported'), words: cleanWords(x.words), folderName: x.folder || x.folderName || null }));
        if (decks.length) return { kind: 'decks', decks };
      }
      if (j && Array.isArray(j.words)) return { kind: 'words', words: cleanWords(j.words), name: String(j.name || baseName || '') };
    } catch (e) { /* fall through to plain text */ }
  }
  // A .csv/.tsv whose lines all have the same 2-3 columns is a list of pairs (word, translation).
  let csvPairs = false;
  if (/\.(csv|tsv)$/i.test(fileName || '')) {
    const counts = t.split(/\r?\n/).map(stripLine).filter(Boolean).map(l => l.split(/[,;]/).length);
    csvPairs = counts.length > 0 && counts.every(c => c === counts[0] && c >= 2 && c <= 3);
  }
  return { kind: 'words', words: parseWords(t, { csvPairs }), name: baseName };
}
function mergeBackup(data, replace) {
  if (replace) { db = normalizeDb(data); saveDb(); return { decks: db.decks.length, folders: db.folders.length }; }
  let nd = 0, nf = 0;
  const folderMap = {};
  for (const f of data.folders) {
    const ex = db.folders.find(x => x.id === f.id) || db.folders.find(x => x.name.toLowerCase() === f.name.toLowerCase());
    if (ex) folderMap[f.id] = ex.id; else { const nfo = { id: f.id, name: f.name }; db.folders.push(nfo); folderMap[f.id] = nfo.id; nf++; }
  }
  for (const k of data.decks) {
    const ex = db.decks.find(x => x.id === k.id);
    const deck = { ...k, folderId: k.folderId ? (folderMap[k.folderId] || null) : null };
    if (ex) { Object.assign(ex, deck); } else { db.decks.push(deck); nd++; }
  }
  if (Array.isArray(data.turnQuestions)) db.turnQuestions = cleanWords((db.turnQuestions || []).concat(data.turnQuestions));
  if (data.queue && Array.isArray(data.queue.groups)) { db.queue = normalizeQueue(db.queue); for (const g of data.queue.groups) if (!db.queue.groups.some(x => x.id === g.id)) db.queue.groups.push(g); db.queue = normalizeQueue(db.queue); }
  saveDb();
  return { decks: nd, folders: nf };
}
function exportBackup() { return JSON.stringify({ ...db, exportedAt: new Date().toISOString(), app: 'Class Games ' + APP_VERSION }, null, 2); }
const safeFile = n => String(n).replace(/[\\/:*?"<>|]/g, '_');
const nWords = n => n + (n === 1 ? ' word' : ' words');

/* ===================== UI helpers ===================== */
let toastTimer;
function toast(msg, ms = 2200) {
  $$('.toast').forEach(t => t.remove());
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.appendChild(t);
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.remove(), ms);
}
function openSheet(html, onMount) {
  const m = document.createElement('div'); m.className = 'modal';
  m.innerHTML = `<div class="sheet">${html}</div>`;
  m.addEventListener('click', e => { if (e.target === m) closeSheet(m); });
  document.body.appendChild(m);
  if (onMount) onMount(m);
  return m;
}
function closeSheet(m) { if (m && m.parentNode) m.remove(); }
function confirmDlg(title, text, okLabel = 'OK', danger = false) {
  return new Promise(res => {
    const m = openSheet(`<h3>${esc(title)}</h3>${text ? `<p>${esc(text)}</p>` : ''}
      <div class="btnrow"><button class="btn sec" data-a="no">Cancel</button><button class="btn ${danger ? 'bad' : ''}" data-a="yes">${esc(okLabel)}</button></div>`);
    m.addEventListener('click', e => { const a = e.target.dataset.a; if (a) { closeSheet(m); res(a === 'yes'); } });
  });
}
function promptDlg(title, value = '', placeholder = '', okLabel = 'Save') {
  return new Promise(res => {
    const m = openSheet(`<h3>${esc(title)}</h3><div class="card"><div class="field"><input type="text" id="pv" value="${esc(value)}" placeholder="${esc(placeholder)}" autocomplete="off" autocapitalize="sentences"></div></div>
      <div class="btnrow" style="margin-top:14px"><button class="btn sec" data-a="no">Cancel</button><button class="btn" data-a="yes">${esc(okLabel)}</button></div>`,
      mm => { const i = $('#pv', mm); setTimeout(() => { i.focus(); i.select(); }, 50); i.addEventListener('keydown', e => { if (e.key === 'Enter') mm.querySelector('[data-a=yes]').click(); }); });
    m.addEventListener('click', e => { const a = e.target.dataset.a; if (a) { const v = $('#pv', m).value; closeSheet(m); res(a === 'yes' ? v : null); } });
  });
}
function chooseDlg(title, options) { // options: [{label, value, sub?, danger?}]
  return new Promise(res => {
    const m = openSheet(`<h3>${esc(title)}</h3><div class="card">${options.map((o, i) => `<div class="row" data-i="${i}"><div class="txt"><div class="t" style="${o.danger ? 'color:var(--bad)' : ''}">${esc(o.label)}</div>${o.sub ? `<div class="s">${esc(o.sub)}</div>` : ''}</div></div>`).join('')}</div>
      <button class="btn sec" data-a="no" style="margin-top:14px">Cancel</button>`);
    m.addEventListener('click', e => {
      const r = e.target.closest('.row'); if (r) { closeSheet(m); res(options[+r.dataset.i].value); return; }
      if (e.target.dataset.a === 'no') { closeSheet(m); res(null); }
    });
  });
}
async function shareOrDownload(text, filename, mime) {
  const blob = new Blob([text], { type: mime });
  try {
    const file = new File([blob], filename, { type: mime });
    if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: filename }); return true; }
  } catch (e) { if (e && e.name === 'AbortError') return false; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = filename; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 2000);
  return true;
}
async function copyText(text) {
  try { await navigator.clipboard.writeText(text); toast('Copied'); return true; } catch (e) { toast('Copy not available'); return false; }
}
function applyTheme() {
  const t = db.settings.theme;
  if (t === 'auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', t);
}
function keepScroll(fn) { const c = $('.content'); const top = c ? c.scrollTop : 0; fn(); const c2 = $('.content'); if (c2 && top) c2.scrollTop = top; }
function topbar(title, left, right) {
  return `<div class="topbar"><div class="side">${left || ''}</div><h1>${esc(title)}</h1><div class="side r">${right || ''}</div></div>`;
}
const backBtn = (label = 'Back', fallback = '#library') => `<button class="tbtn" data-nav="back" data-fallback="${fallback}">‹ ${esc(label)}</button>`;

/* ===================== Router ===================== */
const app = $('#app');
const navState = { depth: 0 };
function route() {
  if (!DEV_BYPASS && !isUnlocked()) { renderLock(); return; }
  const h = location.hash.replace(/^#\/?/, '') || 'home';
  const i = h.indexOf('/');
  const name = i < 0 ? h : h.slice(0, i);
  const arg = i < 0 ? '' : h.slice(i + 1);
  $$('.modal').forEach(m => m.remove());
  const screens = { home: renderHome, library: renderLibrary, deck: renderDeck, edit: renderEdit, setup: renderSetup, play: renderPlay, settings: renderSettings,
    buzz: renderBuzzSetup, buzzplay: renderBuzz, futaba: renderFutabaSetup, futabaplay: renderFutaba, memory: renderMemorySetup, memoryplay: renderMemory,
    queue: a => a ? renderQueueGroup(a) : renderQueueGroups() };
  clearInterval(qTimer);
  (screens[name] || renderHome)(arg);
}
function go(hash) { location.hash = hash; }
function back(fallback = '#library') {
  if (navState.depth > 0) { navState.depth--; history.back(); } else location.replace(fallback);
}
window.addEventListener('hashchange', route);
app.addEventListener('click', e => {
  const b = e.target.closest('[data-nav]'); if (!b) return;
  const v = b.dataset.nav;

function renderLibrary() {
  const s = db.settings;
  const folderBlock = (fid, name, decks, isPresetF) => {
    const key = fid || 'none';
    const collapsed = !!s.collapsed[key];
    const menu = (isPresetF || !fid) ? '' : `<button class="tbtn" data-fmenu="${fid}">•••</button>`;
    const rows = decks.map(k => `<div class="row" data-nav="#deck/${k.id}"><div class="ic">${esc(k.emoji || (isPresetF ? '📚' : '🗂️'))}</div><div class="txt"><div class="t">${esc(k.name)}</div><div class="s">${nWords(k.words.length)}</div></div><div class="chev">›</div></div>`).join('');
    return `<div class="folderhead" data-collapse="${key}"><span class="tri">${collapsed ? '▶' : '▼'}</span><div class="name">${esc(name)}</div><span class="cnt">${decks.length}</span>${menu}</div>
      ${collapsed ? '' : `<div class="card">${rows || `<div class="row static"><div class="txt"><div class="s">Empty folder · use ••• to add a deck</div></div></div>`}</div>`}`;
  };
  const folders = foldersSorted();
  const unfiled = decksInFolder(null);
  let body = '';
  if (!db.decks.length && !folders.length) {
    body += `<div class="empty"><div class="big">🗂️</div>No decks of your own yet.<br>Tap <b>New deck</b> to type a list, or <b>Import</b> to bring in a file or pasted text.</div>`;
  } else {
    if (unfiled.length || !folders.length) body += folderBlock(null, 'My decks', unfiled, false);
    for (const f of folders) body += folderBlock(f.id, f.name, decksInFolder(f.id), false);
  }

    ${topbar('Decks', backBtn('Games', '#home'), `<button class="tbtn" data-nav="#settings">Settings</button>`)}

async function pickGame(deckIds) {

async function folderMenu(fid) {
  const f = getFolder(fid); if (!f) return;
  const v = await chooseDlg(f.name, [
    { label: 'New deck in this folder', value: 'new' },
    { label: 'Rename folder', value: 'rename' },

function renderDeck(id) {
  const k = getDeck(id);
  if (!k) { location.replace('#library'); return; }
  const preset = isPreset(k);
  const folder = preset ? PRESET_FOLDER : getFolder(k.folderId);
  app.innerHTML = `<div class="screen">
    ${topbar(k.name, backBtn(), preset ? '' : `<button class="tbtn" data-nav="#edit/${k.id}">Edit</button>`)}
    <div class="content"><div class="wrap">
      <div class="hint" style="margin:0 4px 12px">${folder ? '📁 ' + esc(folder.name) + ' · ' : ''}${nWords(k.words.length)}${preset ? ' · preset (copy it to edit)' : ''}</div>
      <button class="btn big" data-act="play">▶ Play this deck</button>
      <div class="btnrow" style="margin-top:10px">
        ${preset ? `<button class="btn sec" data-act="copy">Copy to my decks</button>` : `<button class="btn sec" data-act="move">Move</button><button class="btn sec" data-act="dup">Duplicate</button>`}
        <button class="btn sec" data-act="export">Export</button>
      </div>
      <h2 class="sec">Words</h2>
      <div class="chips">${k.words.map(w => `<span class="chip">${esc(term(w))}${hasPair(w) ? `<span class="pair"> · ${esc(parts(w).slice(1).join(' · '))}</span>` : ''}</span>`).join('') || '<span class="hint">No words yet. Tap Edit to add some.</span>'}</div>
      ${!preset && k.words.length && !k.words.some(hasPair) ? '<div class="hint">Tip: add a translation or answer after a vertical bar, e.g. <b>dog | perro</b>, and Futaba and Memory can use it.</div>' : ''}
      ${preset ? '' : `<div style="margin-top:20px"><button class="btn bad" data-act="delete">Delete deck</button></div>`}
    </div></div></div>`;
  $('.screen', app).addEventListener('click', async e => {
    const a = e.target.closest('[data-act]'); if (!a) return;
    const act = a.dataset.act;
    if (act === 'play') pickGame([k.id]);
    if (act === 'copy' || act === 'dup') {
      const d = upsertDeck({ id: uid(), name: uniqueName(k.name), folderId: preset ? null : k.folderId, words: k.words.slice() });
      toast('Copied as "' + d.name + '"'); navState.depth++; go('#edit/' + d.id);
    }
    if (act === 'move') {
      const opts = [{ label: 'My decks (no folder)', value: '' }].concat(foldersSorted().map(f => ({ label: f.name, value: f.id }))).concat([{ label: '+ New folder…', value: '__new' }]);
      let v = await chooseDlg('Move to', opts); if (v === null) return;
      if (v === '__new') { const n = await promptDlg('New folder', '', 'Folder name', 'Create'); if (!n || !n.trim()) return; v = addFolder(n).id; }
      k.folderId = v || null; upsertDeck(k); renderDeck(id); toast('Moved');
    }
    if (act === 'export') {
      const v = await chooseDlg('Export "' + k.name + '"', [
        { label: 'Share as text file (.txt)', value: 'txt', sub: 'One word per line. Re-import it anywhere.' },
        { label: 'Share as JSON', value: 'json', sub: 'Keeps the deck name and folder.' },
        { label: 'Copy words to clipboard', value: 'copy' },
      ]);
      if (v === 'txt') shareOrDownload(k.words.join('\n'), safeFile(k.name) + '.txt', 'text/plain');
      if (v === 'json') shareOrDownload(JSON.stringify({ name: k.name, folder: folder && !preset ? folder.name : null, words: k.words }, null, 2), safeFile(k.name) + '.json', 'application/json');
      if (v === 'copy') copyText(k.words.join('\n'));
    }
    if (act === 'delete') { if (await confirmDlg('Delete "' + k.name + '"?', 'This cannot be undone.', 'Delete', true)) { deleteDeck(id); toast('Deleted'); back('#library'); } }
  });
}

  if (!k || isPreset(k)) { location.replace('#library'); return; }
  const folderOpts = [`<option value="">My decks (no folder)</option>`].concat(foldersSorted().map(f => `<option value="${f.id}" ${k.folderId === f.id ? 'selected' : ''}>${esc(f.name)}</option>`)).concat([`<option value="__new">+ New folder…</option>`]).join('');
  app.innerHTML = `<div class="screen">

      </div>

      <div class="btnrow" style="margin-top:12px"><button class="btn sec" data-act="sort">Sort A–Z</button><button class="btn sec" data-act="clean">Tidy up</button></div>
    </div></div></div>`;
  const ta = $('#dwords', app), name = $('#dname', app), sel = $('#dfolder', app), wc = $('#wcount', app);

      const n = await promptDlg('New folder', '', 'Folder name', 'Create');
      if (n && n.trim()) { const f = addFolder(n); const o = document.createElement('option'); o.value = f.id; o.textContent = f.name; sel.insertBefore(o, sel.lastElementChild); sel.value = f.id; }
      else sel.value = k.folderId || '';

  });
  if (isNew) setTimeout(() => name.focus(), 80);
  const doSave = () => {
    const words = parseWords(ta.value);

  $('.screen', app).addEventListener('click', e => {
    const a = e.target.closest('[data-act]'); if (!a) return;
    if (a.dataset.act === 'save') doSave();

    if (a.dataset.act === 'clean') { ta.value = parseWords(ta.value).join('\n'); count(); toast('Tidied'); }
  });
}

function importSheet() {
  const folderOpts = [`<option value="">My decks (no folder)</option>`].concat(foldersSorted().map(f => `<option value="${f.id}">${esc(f.name)}</option>`)).join('');
  const m = openSheet(`<h3>Import</h3>
    <p>Paste a list, or choose a .txt / .csv / .json file. A full backup file restores everything.</p>
    <div class="card">
      <div class="field"><label>Deck name</label><input type="text" id="iname" placeholder="Name for the new deck" autocomplete="off"></div>
      <div class="field"><label>Folder</label><select id="ifolder">${folderOpts}</select></div>
      <div class="field"><label>List · <span id="icount">0</span> words</label><textarea id="itext" style="min-height:140px" placeholder="Paste here…" autocapitalize="none" autocorrect="off" spellcheck="false"></textarea></div>
    </div>
    <div class="btnrow" style="margin-top:12px"><button class="btn sec" id="ifile">Choose file…</button><button class="btn" id="igo" disabled>Import</button></div>
    <input type="file" id="ifileinput" accept=".txt,.csv,.json,.tsv,text/plain,text/csv,application/json" style="display:none">
    <div id="ibackup" style="display:none;margin-top:14px"></div>
    <button class="btn sec" id="icancel" style="margin-top:10px">Cancel</button>`);
  const ta = $('#itext', m), name = $('#iname', m), goBtn = $('#igo', m), cnt = $('#icount', m), fi = $('#ifileinput', m), bk = $('#ibackup', m);
  let pending = null;
  const analyse = fileName => {
    pending = detectImport(ta.value, fileName);
    bk.style.display = 'none';
    if (pending.kind === 'backup') {
      cnt.textContent = '—'; goBtn.disabled = true; goBtn.textContent = 'Import';
      bk.style.display = 'block';
      bk.innerHTML = `<div class="card"><div class="row static"><div class="ic">💾</div><div class="txt"><div class="t">Backup file</div><div class="s">${pending.data.decks.length} decks · ${pending.data.folders.length} folders</div></div></div></div>
        <div class="btnrow" style="margin-top:10px"><button class="btn" id="bmerge">Merge into mine</button><button class="btn bad" id="breplace">Replace everything</button></div>`;
      $('#bmerge', bk).onclick = () => { const r = mergeBackup(pending.data, false); closeSheet(m); toast(`Merged: ${r.decks} new decks, ${r.folders} new folders`); route(); };
      $('#breplace', bk).onclick = async () => { if (await confirmDlg('Replace everything?', 'All your current decks and folders will be replaced by the backup.', 'Replace', true)) { mergeBackup(pending.data, true); closeSheet(m); toast('Backup restored'); applyTheme(); route(); } };
    } else if (pending.kind === 'decks') {
      cnt.textContent = pending.decks.reduce((a, d) => a + d.words.length, 0) + ' in ' + pending.decks.length + ' decks';
      goBtn.disabled = false; goBtn.textContent = 'Import ' + pending.decks.length + ' decks';
    } else {
      cnt.textContent = pending.words.length; goBtn.disabled = pending.words.length === 0; goBtn.textContent = 'Import';
      if (pending.name && !name.value) name.value = pending.name;
    }
  };
  ta.addEventListener('input', () => analyse(null));
  $('#ifile', m).onclick = () => fi.click();
  fi.addEventListener('change', () => {
    const f = fi.files && fi.files[0]; if (!f) return;
    const r = new FileReader();
    r.onload = () => { ta.value = String(r.result || ''); analyse(f.name); };
    r.onerror = () => toast('Could not read the file');
    r.readAsText(f);
  });
  goBtn.onclick = () => {
    if (!pending) return;
    const fid = $('#ifolder', m).value || null;
    if (pending.kind === 'decks') {
      let n = 0;
      for (const d of pending.decks) {
        let folderId = fid;
        if (!folderId && d.folderName) { const ex = db.folders.find(f => f.name.toLowerCase() === String(d.folderName).toLowerCase()); folderId = ex ? ex.id : addFolder(String(d.folderName)).id; }
        upsertDeck({ id: uid(), name: uniqueName(d.name), folderId, words: d.words }); n++;
      }
      closeSheet(m); toast('Imported ' + n + ' decks'); route();
    } else {
      const d = upsertDeck({ id: uid(), name: uniqueName(name.value.trim() || pending.name || 'Imported deck'), folderId: fid, words: pending.words });
      closeSheet(m); toast('Imported ' + nWords(d.words.length)); navState.depth++; go('#deck/' + d.id);
    }
  };
  $('#icancel', m).onclick = () => closeSheet(m);
}

  s.lastDecks = s.lastDecks.filter(id => validIds.has(id));
  if (!s.lastDecks.length) s.lastDecks = [all[0].id];
  const selected = new Set(s.lastDecks);
  const groups = [];
  const unfiled = decksInFolder(null); if (unfiled.length) groups.push({ id: 'none', name: 'My decks', decks: unfiled });
  for (const f of foldersSorted()) { const d = decksInFolder(f.id); if (d.length) groups.push({ id: f.id, name: f.name, decks: d }); }
  if (s.showPresets) groups.push({ id: 'preset', name: 'Preset decks', decks: PRESET_DECKS });
  const times = [30, 45, 60, 90, 120, 0];

/* ===================== Game engine ===================== */
/* game.pool  = words not yet shown in this game (shuffled)
   game.used  = words already shown (when "no repeats" is on they wait here until the pool runs dry)
   game.queue = this round's working list; a passed word goes to the back of it */
let game = null;
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

  const s = db.settings;
  const words = cleanWords(deckIds.map(getDeck).filter(Boolean).flatMap(k => k.words));
  if (!words.length) { toast('No words selected'); return; }
  game = { words, pool: shuffle(words.slice()), used: [], queue: [],
    teams: Array.from({ length: s.teams }, (_, i) => ({ name: s.teamNames[i] || `Team ${i + 1}`, score: 0 })),
    turn: 0, round: 1, phase: 'ready', current: null, got: [], passed: [], endAt: 0, timer: null, count: 3, lastTick: null };
  audio.unlock();
  keepAwake(true);
  if (db.settings.tilt && tilt.granted === null) tiltEnable();   // ask for motion access now, on the teacher's tap, not in front of the actor
  if (location.hash === '#play') renderPlay(); else { navState.depth++; go('#play'); }
}
function exitGame() { stopGame(); leaveTo('#setup'); }
/* Leave a play screen: back to the previous screen (normally the game's setup) */

}
function refill() {

}
function nextWord() {

}
function markWord(ok) {

  else { g.passed.push(w); audio.buzz(); }
  if (!ok && db.settings.allowPass) g.queue.push(w);       // comes back later this round
  else if (db.settings.avoidRepeats) g.used.push(w);        // parked until the pool is empty
  else g.pool.push(w);                                      // may show up again any time
  if (!ok && db.settings.allowPass && g.queue.length === 1 && g.queue[0] === w && g.pool.length) {

}
function endRound() {

}
function beginRound() {
  const g = game;

  renderPlay();
  const step = () => {
    if (!game || game.phase !== 'countdown') return;
    g.count--;

}
function goWords() {
  const g = game; clearTimeout(g.timer);
  g.phase = 'word'; if (tilt.on) tiltArm();
  nextWord();
  const secs = db.settings.roundSeconds;
  g.endAt = secs ? Date.now() + secs * 1000 : 0;
  g.lastTick = null;
  renderPlay();
  g.timer = setInterval(() => {
    if (!game || game.phase !== 'word') return;
    const ts = $('#tiltst'); if (ts) ts.textContent = tiltStatus();
    if (g.endAt) {
      const left = Math.max(0, g.endAt - Date.now());
      updateTimer(left, secs * 1000);
      const sec = Math.ceil(left / 1000);

function updateTimer(left, total) {

const fmt = ms => { const s = Math.ceil(ms / 1000); return s >= 60 ? Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0') : String(s); };
function fitWord(el) {

  let guard = 0;

}
function renderPlay() {

      <div class="center"><div class="h">${multi ? esc(team.name) + ', get ready!' : 'Get ready!'}</div>
      <div class="t">${s.tilt ? 'Actor: hold the iPad on your forehead, screen facing the class.<br>Tilt it <b>down</b> when they get it, tilt it <b>back</b> to pass.' : 'Give the iPad to the actor. Only they should see the screen.'}<br>${s.roundSeconds ? s.roundSeconds + ' seconds' : 'No time limit'} · ${nWords(g.words.length)}</div>
      <button class="pbtn" data-p="begin">I'm the actor · Start</button>
      ${multi ? `<div class="score" style="margin-top:28px">${g.teams.map((t, i) => `<div class="${i === g.turn ? 'lead' : ''}"><div class="n">${esc(t.name)}</div><div class="v">${t.score}</div></div>`).join('')}</div>` : ''}

        <div class="rlist">${g.got.map(w => `<div><span>${esc(term(w))}</span><span>✓</span></div>`).join('')}${passedOnly.map(w => `<div style="opacity:.7"><span>${esc(term(w))}</span><span>↷</span></div>`).join('')}${!g.got.length && !passedOnly.length ? '<div><span>No words played</span></div>' : ''}</div>

}
let flashing = false;
function flashThen(cls, fn) {

document.addEventListener('keydown', e => {

/* Tilt controls (Heads Up style). pitch = angle of the screen normal above horizontal:
   +90 screen faces the ceiling, 0 upright (on the forehead), -90 screen faces the floor.
   The resting angle is measured when the first word appears, so a sloping forehead does not matter. */
const tilt = { on: false, handler: null, state: 'idle', neutral: 0, samples: [], count: 0, pitch: 0, test: null, granted: null };
const tiltUp = (beta, gamma) => Math.cos((beta || 0) * Math.PI / 180) * Math.cos((gamma || 0) * Math.PI / 180);
const tiltPitch = (beta, gamma) => Math.asin(Math.max(-1, Math.min(1, tiltUp(beta, gamma)))) * 180 / Math.PI;
function tiltArm() { tilt.state = 'calib'; tilt.samples = []; }
async function tiltEnable() {
  tilt.on = false;
  if (!db.settings.tilt) return false;
  try {
    if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
      if (tilt.granted === null) tilt.granted = (await DeviceOrientationEvent.requestPermission()) === 'granted';   // iOS asks once per launch; we never ask twice
      if (!tilt.granted) { toast('Tilt not allowed. Use the buttons or swipe.', 3000); return false; }
    } else if (typeof DeviceOrientationEvent === 'undefined') { toast('No motion sensor on this device', 3000); return false; }
    if (!tilt.handler) { tilt.handler = onTilt; window.addEventListener('deviceorientation', tilt.handler); }
    tilt.on = true; tilt.count = 0; tiltArm(); return true;
  } catch (e) { toast('Tilt not available: ' + (e && e.message || e), 4000); return false; }
}
function tiltDisable() { if (tilt.handler) window.removeEventListener('deviceorientation', tilt.handler); tilt.handler = null; tilt.on = false; tilt.state = 'idle'; tilt.test = null; }
function tiltStep(pitch) {  // returns 'got' | 'pass' | 'next' | null
  if (tilt.state === 'calib') {
    tilt.samples.push(pitch);
    if (tilt.samples.length >= 8) { const o = tilt.samples.slice().sort((x, y) => x - y); tilt.neutral = Math.max(-25, Math.min(30, o[o.length >> 1])); tilt.state = 'ready'; }
    return null;
  }
  const d = pitch - tilt.neutral;
  if (tilt.state === 'ready') {
    if (d < -35) { tilt.state = 'fired'; return 'got'; }                                   // screen towards the floor
    if (d > 28 || pitch > 70) { tilt.state = 'fired'; return db.settings.allowPass ? 'pass' : null; }   // screen towards the ceiling
    return null;
  }
  if (tilt.state === 'fired' && Math.abs(d) < 12) { tilt.state = 'ready'; return 'next'; }
  return null;
}
function onTilt(e) {
  tilt.count++; tilt.pitch = tiltPitch(e.beta, e.gamma);
  if (tilt.test) { tilt.test(tilt.pitch); return; }
  if (!game || game.phase !== 'word' || !tilt.on) return;
  const r = tiltStep(tilt.pitch);
  if (r === 'got' || r === 'pass') {
    const ok = r === 'got';
    markWord(ok);
    if (!game || game.phase !== 'word') return;
    const root = $('.play'); if (root) { root.classList.remove('good', 'pass'); root.classList.add(ok ? 'good' : 'pass'); const w = $('.word span'); if (w) { w.textContent = ok ? '✓ Got it!' : 'Pass'; fitWord(w); } }
  } else if (r === 'next') renderPlay();
}
const tiltStatus = () => !tilt.count ? '📐 no motion data yet' : tilt.state === 'calib' ? '📐 hold still…' : tilt.state === 'ready' ? '📐 tilt ready' : '📐 back upright for the next word';

/* Keep the screen on while playing */
let wakeLock = null;
async function keepAwake(on) {
  try {
    if (on && 'wakeLock' in navigator && !wakeLock) { wakeLock = await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release', () => { wakeLock = null; }); }
    if (!on && wakeLock) { const w = wakeLock; wakeLock = null; await w.release(); }
  } catch (e) { wakeLock = null; }
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && game && location.hash === '#play') keepAwake(true); });
window.addEventListener('hashchange', () => {
  const playing = /^#(play|buzzplay|futabaplay|memoryplay)$/.test(location.hash);
  keepAwake(playing);
  if (!playing) { try { speechSynthesis.cancel(); } catch (e) {} }
  if (!playing && game) { if (game.phase === 'word' || game.phase === 'countdown') { clearInterval(game.timer); clearTimeout(game.timer); game.phase = 'ready'; game.pool = game.queue.concat(game.pool); game.queue = []; game.current = null; } }
});

/* ===================== Audio (synthesised, no files) ===================== */
const audio = {
  ctx: null,
  unlock() { if (!db.settings.sound) return; try { this.ctx = this.ctx || new (window.AudioContext || window.webkitAudioContext)(); if (this.ctx.state === 'suspended') this.ctx.resume(); } catch (e) {} },
  beep(freq, dur, type = 'sine', vol = 0.25, when = 0) {
    if (!db.settings.sound || !this.ctx) return;
    try { const o = this.ctx.createOscillator(), g = this.ctx.createGain(); o.type = type; o.frequency.value = freq;
      o.connect(g); g.connect(this.ctx.destination); const t = this.ctx.currentTime + when; g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur); o.start(t); o.stop(t + dur + 0.02); } catch (e) {}
  },
  tick(soft) { this.beep(soft ? 660 : 1000, 0.08, 'square', soft ? 0.08 : 0.12); },
  ding() { this.beep(880, 0.12, 'sine', 0.2); this.beep(1320, 0.18, 'sine', 0.2, 0.09); },
  buzz() { this.beep(220, 0.18, 'sawtooth', 0.12); },
  horn() { this.beep(392, 0.35, 'square', 0.18); this.beep(311, 0.6, 'square', 0.18, 0.3); },
};

/* ===================== Shared game-setup helpers ===================== */
const GAME_DEFAULTS = {

  futaba: { lastDecks: [], players: 2, mode: 'mix', mix: { pairs: true, listen: true, scramble: true, gaps: true }, options: 4, rounds: 10, promptSide: 'answer', voice: 'en-GB', voiceName: '' },

const rnd = (lo, hi) => lo + Math.floor(Math.random() * (hi - lo + 1));
function mathQuestion() {
  const k = rnd(0, 7); let q, a;
  if (k === 0) { const x = rnd(2, 20), y = rnd(2, 20); q = `${x} + ${y} = ?`; a = x + y; }

  else if (k === 2) { const x = rnd(2, 9), y = rnd(2, 9); q = `${x} × ${y} = ?`; a = x * y; }
  else if (k === 3) { const x = rnd(3, 25); q = `Double ${x}`; a = x * 2; }
  else if (k === 4) { const x = rnd(2, 20) * 2; q = `Half of ${x}`; a = x / 2; }
  else if (k === 5) { const x = rnd(1, 9), y = rnd(1, 9), z = rnd(1, 9); q = `${x} + ${y} + ${z} = ?`; a = x + y + z; }

  else { const x = rnd(2, 9), y = rnd(2, 9); q = `${x * y} ÷ ${x} = ?`; a = y; }

}
function parseTurnQuestion(line) {
  const group = /#group\b/i.test(line); const ps = parts(line.replace(/#group\b/ig, '').trim());

}
function turnQuestionPool(cfg) {
  const on = cfg.qCats || {}; const pool = [];
  if (on.body) TQ.body.forEach(q => pool.push({ q, a: '', cat: 'body', group: false }));
  if (on.simon) TQ.simon.forEach(q => pool.push({ q, a: '', cat: 'simon', group: false }));
  if (on.capitals) TQ.capitals.forEach(([c, cap]) => { pool.push({ q: `What is the capital of ${c}?`, a: cap, cat: 'capitals', group: false }); pool.push({ q: `${cap} is the capital of which country?`, a: c.replace(/^the /, 'The '), cat: 'capitals', group: false }); });

  if (on.mine) (db.turnQuestions || []).map(parseTurnQuestion).filter(Boolean).forEach(x => pool.push(x));
  return pool;
}
/* Picks the next turn question: no repeats until the pool is used up, group questions capped at 20% of those asked. */
function pickTurnQuestion(b) {
  const cfg = b.cfg; const pool = turnQuestionPool(cfg);
  const groupOk = (b.qGroup + 1) <= Math.floor(0.2 * (b.qAsked + 1));
  const cats = []; if (cfg.qCats.math) cats.push('math'); pool.forEach(x => { if (!cats.includes(x.cat)) cats.push(x.cat); });
  if (!cats.length) return null;
  let cand = pool.filter(x => !b.qUsed.has(x.q) && (groupOk || !x.group));
  if (!cand.length && pool.length) { b.qUsed.clear(); cand = pool.filter(x => groupOk || !x.group); }
  const cat = cats[rnd(0, cats.length - 1)];
  let q;
  if (cat === 'math') q = mathQuestion();
  else {
    const inCat = cand.filter(x => x.cat === cat);
    const wantGroup = groupOk && Math.random() < 0.6 && inCat.some(x => x.group);
    let list = inCat.filter(x => x.group === wantGroup); if (!list.length) list = inCat.length ? inCat : cand;
    q = list.length ? list[rnd(0, list.length - 1)] : mathQuestion();
  }
  if (!q) return null;
  b.qUsed.add(q.q); b.qAsked++; if (q.group) b.qGroup++;
  return q;
}

const AUTH = { key: 'classGames.auth', salt: 'classgames-v1', iterations: 100000, days: 30, hash: 'f5747d8cd2c8d481d370bc6798242cbae120b6ed6916bbb7c82309143862b9b2' };
const DEV_BYPASS = /selftest|demo=|dev=/.test(location.search);
function isUnlocked() { try { const a = JSON.parse(localStorage.getItem(AUTH.key) || 'null'); return !!(a && a.until > Date.now()); } catch (e) { return false; } }
function setUnlocked(remember) { try { localStorage.setItem(AUTH.key, JSON.stringify({ until: Date.now() + (remember ? AUTH.days : 0.5) * 86400000 })); } catch (e) {} }
async function checkLogin(u, p) {
  try {
    const enc = new TextEncoder();
    const key = await crypto.subtle.importKey('raw', enc.encode(String(u).trim().toLowerCase() + ':' + p), 'PBKDF2', false, ['deriveBits']);
    const bits = await crypto.subtle.deriveBits({ name: 'PBKDF2', salt: enc.encode(AUTH.salt), iterations: AUTH.iterations, hash: 'SHA-256' }, key, 256);
    return [...new Uint8Array(bits)].map(b => b.toString(16).padStart(2, '0')).join('') === AUTH.hash;
  } catch (e) { toast('Sign-in needs a secure (https) connection'); return false; }
}
function renderLock() {
  app.innerHTML = `<div class="screen"><div class="content" style="display:flex;align-items:center;justify-content:center"><form id="lockform" class="wrap" style="max-width:420px" autocomplete="on">

      <div class="toggle" id="lremrow"><div><div class="lbl">Keep me signed in</div><div class="sub">On this iPad, for 30 days</div></div><div class="sw on" id="lrem"></div></div>
    </div>
    <div style="margin-top:14px"><button class="btn big" type="submit">Sign in</button></div>
    <div class="hint" id="lmsg">Tip: sign in once in Safari and let it save the password. After that Face ID fills it in.</div>
    <div class="ver">v${APP_VERSION}</div></form></div></div>`;
  let remember = true;
  $('#lremrow').addEventListener('click', e => { if (e.target.closest('input')) return; remember = !remember; $('#lrem').classList.toggle('on', remember); });
  $('#lockform').addEventListener('submit', async e => {
    e.preventDefault(); const btn = $('#lockform button[type=submit]'); btn.disabled = true; btn.textContent = 'Checking…';

}
