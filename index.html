<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Phunzies Classroom</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Phunzies">
<meta name="theme-color" content="#5b4bdb">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<style>
:root{
  --bg:#f2f2f7; --card:#ffffff; --card2:#f7f7fa; --text:#111118; --muted:#6e6e78; --line:#e4e4ea;
  --accent:#5b4bdb; --accent2:#7c6cf0; --on-accent:#fff;
  --ok:#22a06b; --warn:#f59e0b; --bad:#e5484d;
  --sa-t:env(safe-area-inset-top,0px); --sa-b:env(safe-area-inset-bottom,0px);
  --sa-l:env(safe-area-inset-left,0px); --sa-r:env(safe-area-inset-right,0px);
  --radius:16px; --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
:root[data-theme="dark"]{
  --bg:#0f0f14; --card:#1c1c24; --card2:#24242e; --text:#f3f3f8; --muted:#9a9aa8; --line:#2c2c38;
  --accent:#8b7cf6; --accent2:#a597ff;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0f0f14; --card:#1c1c24; --card2:#24242e; --text:#f3f3f8; --muted:#9a9aa8; --line:#2c2c38;
    --accent:#8b7cf6; --accent2:#a597ff;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:var(--font);
  -webkit-text-size-adjust:100%;overscroll-behavior:none;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
input,textarea{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}
#app{position:fixed;inset:0;display:flex;flex-direction:column;overflow:hidden}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;overflow:hidden;background:var(--bg)}
.topbar{flex:0 0 auto;display:flex;align-items:center;gap:8px;min-height:52px;
  padding:calc(var(--sa-t) + 6px) calc(var(--sa-r) + 10px) 6px calc(var(--sa-l) + 10px);
  background:var(--bg);border-bottom:1px solid var(--line)}
.topbar h1{flex:1;font-size:19px;font-weight:700;margin:0;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .side{flex:0 0 84px;display:flex;align-items:center}
.topbar .side.r{justify-content:flex-end}
.tbtn{background:none;border:0;color:var(--accent);font:inherit;font-size:17px;font-weight:600;padding:8px 6px;border-radius:10px;min-height:44px;cursor:pointer;white-space:nowrap}
.tbtn:active{opacity:.5}
.content{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px calc(var(--sa-r) + 14px) calc(var(--sa-b) + 24px) calc(var(--sa-l) + 14px)}
.wrap{max-width:720px;margin:0 auto;width:100%}
h2.sec{font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:22px 4px 8px}
.card{background:var(--card);border-radius:var(--radius);overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.row{display:flex;align-items:center;gap:12px;padding:13px 16px;min-height:54px;border-bottom:1px solid var(--line);cursor:pointer;background:var(--card)}
.row:last-child{border-bottom:0}
.row:active{background:var(--card2)}
.row .ic{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;background:var(--card2);flex:0 0 36px}
.row .txt{flex:1;min-width:0}
.row .t{font-size:17px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s{font-size:13px;color:var(--muted);margin-top:2px}
.row .chev{color:var(--muted);font-size:20px;opacity:.6}
.row.static{cursor:default}.row.static:active{background:var(--card)}
.folderhead{display:flex;align-items:center;gap:8px;padding:10px 4px 8px;margin-top:18px}
.folderhead .tri{width:30px;text-align:left;font-size:15px;color:var(--muted)}
.folderhead .name{flex:1;font-size:16px;font-weight:700;cursor:pointer}
.folderhead .cnt{color:var(--muted);font-size:13px}
.folderhead .tbtn{font-size:15px;padding:6px 8px;min-height:36px}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:15px 18px;font:inherit;font-size:17px;font-weight:600;
  background:var(--accent);color:var(--on-accent);cursor:pointer;text-align:center}
.btn:active{filter:brightness(.9)}
.btn.sec{background:var(--card);color:var(--accent);border:1px solid var(--line)}
.btn.bad{background:var(--card);color:var(--bad);border:1px solid var(--line)}
.btn.ok{background:var(--ok)}
.btn.big{font-size:20px;padding:20px}
.btn[disabled]{opacity:.45;pointer-events:none}
.btnrow{display:flex;gap:10px}
.btnrow .btn{flex:1;padding-left:8px;padding-right:8px}
.field{padding:12px 16px;border-bottom:1px solid var(--line);background:var(--card)}
.field:last-child{border-bottom:0}
.field label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
.field input[type=text],.field select,.field textarea{width:100%;border:0;background:transparent;color:var(--text);font:inherit;font-size:17px;padding:4px 0;outline:none}
.field textarea{min-height:220px;resize:vertical;line-height:1.45;font-size:17px}
.field select{-webkit-appearance:none;appearance:none}
.hint{font-size:13px;color:var(--muted);margin:8px 4px 0;line-height:1.4}
.chips{display:flex;flex-wrap:wrap;gap:8px;padding:12px 4px}
.chip{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:7px 13px;font-size:15px}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;min-height:54px;border-bottom:1px solid var(--line);background:var(--card);cursor:pointer}
.toggle:last-child{border-bottom:0}
.toggle .lbl{font-size:17px}
.toggle .sub{font-size:13px;color:var(--muted);margin-top:2px}
.sw{width:51px;height:31px;border-radius:16px;background:#c9c9d1;position:relative;transition:background .2s;flex:0 0 51px}
:root[data-theme="dark"] .sw{background:#3a3a46}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .sw{background:#3a3a46}}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.25);transition:transform .2s}
.sw.on{background:var(--ok)!important}.sw.on::after{transform:translateX(20px)}
.seg{display:flex;background:var(--card2);border-radius:12px;padding:3px;gap:2px;border:1px solid var(--line)}
.seg button{flex:1;border:0;background:transparent;color:var(--text);font:inherit;font-size:15px;font-weight:600;padding:10px 4px;border-radius:10px;cursor:pointer;min-height:40px}
.seg button.on{background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.stepper{display:flex;align-items:center;gap:0;background:var(--card2);border-radius:10px}
.stepper button{width:44px;height:38px;border:0;background:transparent;color:var(--accent);font-size:22px;font-weight:600;cursor:pointer}
.stepper span{min-width:28px;text-align:center;font-weight:700;font-size:17px}
.check{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);flex:0 0 26px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:15px}
.check.on{background:var(--accent);border-color:var(--accent)}
.empty{padding:40px 20px;text-align:center;color:var(--muted);font-size:15px;line-height:1.5}
.empty .big{font-size:44px;margin-bottom:10px}
.games{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.gcard{background:var(--card);border-radius:20px;padding:22px 20px;min-height:150px;display:flex;flex-direction:column;justify-content:flex-end;cursor:pointer;position:relative;overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.gcard:active{transform:scale(.98)}
.gcard .emoji{font-size:44px;position:absolute;top:16px;right:18px}
.gcard .n{font-size:22px;font-weight:800}
.gcard .d{font-size:14px;color:var(--muted);margin-top:4px}
.gcard.soon{opacity:.55;cursor:default}
.gcard.charades{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff}
.gcard.charades .d{color:rgba(255,255,255,.85)}
.hero{padding:calc(var(--sa-t) + 26px) 20px 18px;text-align:center}
.hero .title{font-size:34px;font-weight:800;letter-spacing:-.02em}
.hero .sub{color:var(--muted);font-size:15px;margin-top:4px}
/* modal / sheet */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:50;animation:fade .15s}
@media (min-width:600px){.modal{align-items:center;padding:20px}}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:calc(100% - var(--sa-t) - 20px);border-radius:22px 22px 0 0;padding:14px 16px calc(var(--sa-b) + 16px);overflow-y:auto;animation:up .2s}
@media (min-width:600px){.sheet{border-radius:22px;padding-bottom:16px}}
.sheet h3{margin:4px 0 12px;font-size:20px;text-align:center}
.sheet p{margin:0 0 16px;text-align:center;color:var(--muted);font-size:15px;line-height:1.45}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(30px)}}
.toast{position:fixed;left:50%;bottom:calc(var(--sa-b) + 26px);transform:translateX(-50%);background:#222;color:#fff;padding:11px 18px;border-radius:999px;font-size:15px;z-index:60;box-shadow:0 4px 16px rgba(0,0,0,.3);max-width:88%;text-align:center;animation:fade .2s}
/* play */
.play{background:var(--accent);color:#fff;position:absolute;inset:0;display:flex;flex-direction:column;overflow:hidden;
  padding:var(--sa-t) var(--sa-r) var(--sa-b) var(--sa-l);transition:background .12s}
.play.ready{background:#1f1f2b}
.play.good{background:var(--ok)}
.play.pass{background:var(--warn)}
.play .ptop{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;font-size:16px;font-weight:600}
.play .ptop button{background:rgba(255,255,255,.18);border:0;color:#fff;font:inherit;font-size:15px;font-weight:600;padding:9px 14px;border-radius:999px;min-height:40px;cursor:pointer}
.play .timerbar{height:6px;background:rgba(255,255,255,.25);margin:0 14px;border-radius:3px;overflow:hidden}
.play .timerbar i{display:block;height:100%;background:#fff;width:100%;transition:width .2s linear}
.play .timerbar.hot i{background:#ffd166}
.play .clock{font-variant-numeric:tabular-nums;font-size:22px;font-weight:800;min-width:60px;text-align:center}
.play .word{flex:1;display:flex;align-items:center;justify-content:center;text-align:center;padding:10px 24px;font-weight:800;line-height:1.08;word-break:break-word;letter-spacing:-.01em;min-height:0}
.play .word span{display:block;width:100%}
.play .sub{text-align:center;opacity:.8;font-size:16px;padding:0 20px 8px}
.play .actions{display:flex;gap:14px;padding:10px 16px 18px}
.play .actions button{flex:1;border:0;border-radius:22px;padding:22px 10px;font:inherit;font-size:24px;font-weight:800;cursor:pointer;min-height:96px;color:#fff}
.play .actions .p{background:rgba(0,0,0,.28)}
.play .actions .g{background:rgba(255,255,255,.22)}
.play .actions button:active{transform:scale(.97)}
.play .center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;overflow-y:auto}
.play .center .h{font-size:34px;font-weight:800;margin-bottom:8px}
.play .center .t{font-size:18px;opacity:.85;line-height:1.5;max-width:520px}
.play .center .count{font-size:140px;font-weight:900;line-height:1}
.play .pbtn{background:#fff;color:#1f1f2b;border:0;border-radius:16px;padding:18px 34px;font:inherit;font-size:20px;font-weight:700;margin-top:22px;cursor:pointer;min-width:220px}
.play .pbtn.ghost{background:rgba(255,255,255,.14);color:#fff}
.play .pbtn:active{filter:brightness(.9)}
.play .results{flex:1;overflow-y:auto;padding:0 16px;width:100%;max-width:640px;margin:0 auto}
.play .rlist{background:rgba(255,255,255,.12);border-radius:14px;padding:6px 0;margin:10px 0}
.play .rlist div{padding:8px 14px;font-size:17px;display:flex;justify-content:space-between}
.play .rlist div + div{border-top:1px solid rgba(255,255,255,.1)}
.play .score{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:8px 0 10px}
.play .score>div{background:rgba(255,255,255,.14);border-radius:14px;padding:12px 18px;min-width:120px;text-align:center}
.play .score>div.lead{background:#fff;color:#1f1f2b}
.play .score .n{font-size:14px;opacity:.85}.play .score .v{font-size:30px;font-weight:900}
.play .resacts{display:flex;gap:10px;padding:12px 16px 12px;width:100%;max-width:640px;margin:0 auto}
.play .resacts .pbtn{flex:1;margin:0;min-width:0;padding:16px 10px;font-size:18px}
@media (orientation:landscape) and (max-height:520px){
  .play .actions button{min-height:70px;padding:14px;font-size:20px}
  .play .center .h{font-size:26px}.play .center .count{font-size:100px}
}
/* extra game cards */
.gcard.buzz{background:linear-gradient(135deg,#0f9d6e,#22c78e);color:#fff}.gcard.buzz .d{color:rgba(255,255,255,.85)}
.gcard.futaba{background:linear-gradient(135deg,#e8621a,#f5a524);color:#fff}.gcard.futaba .d{color:rgba(255,255,255,.85)}
.gcard.memory{background:linear-gradient(135deg,#c2338f,#ef5b7a);color:#fff}.gcard.memory .d{color:rgba(255,255,255,.85)}
.chip .pair{color:var(--muted)}
.seg.wrap{flex-wrap:wrap}.seg.wrap button{flex:1 1 30%;min-width:90px}
.play .pbtn.small{padding:10px 20px;font-size:16px;min-width:0;margin-top:10px}
/* buzz monster */
.play.bz .score{margin:4px 10px}
.bboard{flex:1;display:grid;gap:8px;padding:6px 14px 14px;grid-auto-rows:minmax(0,1fr);min-height:0}
.bhead{display:flex;align-items:center;justify-content:center;text-align:center;font-weight:800;font-size:clamp(12px,1.8vw,20px);background:rgba(255,255,255,.12);border-radius:12px;padding:6px;line-height:1.15;overflow:hidden}
.bcell{border:0;border-radius:14px;background:#fff;color:#1f1f2b;font:inherit;font-weight:900;font-size:clamp(18px,3vw,40px);cursor:pointer;min-height:0}
.bcell:active{transform:scale(.96)}
.bcell.done{background:rgba(255,255,255,.12);color:#fff;font-size:clamp(18px,3vw,36px);cursor:default}
.bcard{position:absolute;inset:0;background:var(--accent);color:#fff;display:flex;flex-direction:column;animation:fade .15s;padding:var(--sa-t) var(--sa-r) var(--sa-b) var(--sa-l)}
.bcard-face{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:16px;min-height:0}
.bcat{font-size:18px;font-weight:700;opacity:.85;margin-bottom:6px}
.bword{flex:1;display:flex;align-items:center;justify-content:center;font-weight:800;line-height:1.08;width:100%;min-height:0;padding:0 20px;word-break:break-word}
.bword span{display:block;width:100%}
.banswer{font-size:clamp(20px,3.5vw,34px);font-weight:700;background:rgba(0,0,0,.2);padding:10px 22px;border-radius:14px;margin-top:8px}
.bjudge{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:14px}
.bjudge .pbtn{margin:0;min-width:160px;padding:16px 22px;font-size:18px}
.bjudge.full{flex-wrap:nowrap;gap:8px;padding:0 10px calc(var(--sa-b) + 10px);margin:0;width:100%}
.bjudge.full .pbtn{flex:1;min-width:0;padding:22px 6px;font-size:clamp(15px,2vw,22px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:80px}
.bcard .t{font-size:20px;opacity:.9}
.tqgroup{background:#ffd166;color:#1f1f2b;padding:4px 12px;border-radius:999px;font-weight:800}
/* new games */
.gcard.quiz{background:linear-gradient(135deg,#46178f,#7b2cbf);color:#fff}.gcard.quiz .d{color:rgba(255,255,255,.85)}
.gcard.ttt{background:linear-gradient(135deg,#0f766e,#14b8a6);color:#fff}.gcard.ttt .d{color:rgba(255,255,255,.85)}
.gcard.bam{background:linear-gradient(135deg,#b45309,#f59e0b);color:#fff}.gcard.bam .d{color:rgba(255,255,255,.85)}
.gcard.snakes{background:linear-gradient(135deg,#166534,#4ade80);color:#fff}.gcard.snakes .d{color:rgba(255,255,255,.85)}
.gcard.hangman{background:linear-gradient(135deg,#7f1d1d,#ef4444);color:#fff}.gcard.hangman .d{color:rgba(255,255,255,.85)}
.gcard.roulette{background:linear-gradient(135deg,#be185d,#f472b6);color:#fff}.gcard.roulette .d{color:rgba(255,255,255,.85)}
.gcard.timer{background:linear-gradient(135deg,#374151,#6b7280);color:#fff}.gcard.timer .d{color:rgba(255,255,255,.85)}
.qopts{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;max-width:900px;margin:8px auto;flex:1;min-height:0}
.qopt{border-radius:14px;color:#fff;font-weight:800;font-size:clamp(16px,3vw,30px);display:flex;align-items:center;gap:12px;padding:10px 16px;min-height:64px;text-align:left}
.qopt .sym{font-size:1.2em;opacity:.9}.qopt.dim{opacity:.25}.qopt.right{box-shadow:0 0 0 5px #fff}
.qcard .bword span{overflow-wrap:anywhere}
.tboard{flex:1;display:grid;gap:8px;padding:8px 14px 8px;grid-auto-rows:minmax(0,1fr);min-height:0;max-width:calc(100vh - 200px);width:100%;margin:0 auto}
.tcell{border:0;border-radius:14px;background:#fff;color:#1f1f2b;font:inherit;font-weight:900;font-size:clamp(20px,5vmin,64px);cursor:pointer;min-height:0}
.tcell.taken{background:rgba(255,255,255,.12)}.tcell.win{background:#ffd166;color:#1f1f2b!important}
.sboardwrap{position:relative;flex:1;min-height:0;width:100%;max-width:calc(100vh - 210px);margin:0 auto;padding:4px 14px}
.sboard{display:grid;gap:3px;height:100%;grid-auto-rows:minmax(0,1fr)}
.scell{background:rgba(255,255,255,.1);border-radius:6px;position:relative;min-height:0;overflow:hidden}
.scell.lad{background:rgba(74,222,128,.28)}.scell.snk{background:rgba(239,68,68,.28)}.scell.end{background:#ffd166;color:#1f1f2b}
.scell .num{position:absolute;top:2px;left:4px;font-size:clamp(9px,1.6vmin,14px);font-weight:700;opacity:.8}
.scell .tag{position:absolute;bottom:2px;right:3px;font-size:clamp(8px,1.4vmin,12px);font-weight:800}
.scell .toks{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:2px;flex-wrap:wrap}
.scell .tok{width:clamp(14px,3vmin,26px);height:clamp(14px,3vmin,26px);border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-style:normal;font-size:clamp(9px,1.8vmin,14px);font-weight:900;color:#fff;border:2px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.4)}
.slines{position:absolute;inset:4px 14px;width:calc(100% - 28px);height:calc(100% - 8px);pointer-events:none}
.slines line{stroke-width:1.2;stroke-linecap:round;opacity:.85}.slines line.l{stroke:#4ade80}.slines line.s{stroke:#ef4444;stroke-dasharray:2 1.2}
.dice{width:120px;height:120px;border-radius:24px;background:#fff;color:#1f1f2b;font-size:72px;font-weight:900;display:flex;align-items:center;justify-content:center;margin:10px auto;box-shadow:0 6px 20px rgba(0,0,0,.3)}
.dice.rolling{animation:shake .12s infinite}
@keyframes shake{0%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}100%{transform:rotate(-8deg)}}
.rou{flex:1;display:flex;gap:14px;padding:10px calc(var(--sa-r) + 14px) calc(var(--sa-b) + 14px) calc(var(--sa-l) + 14px);min-height:0}
.rouwheelwrap{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;min-width:0;position:relative}
.rouwheel{width:min(70vh,100%);max-width:640px;aspect-ratio:1;border-radius:50%;box-shadow:0 0 0 6px var(--card),0 8px 30px rgba(0,0,0,.3)}
.roupointer{font-size:34px;line-height:1;color:var(--warn);margin-bottom:-22px;z-index:2;text-shadow:0 2px 4px rgba(0,0,0,.4)}
.roubtn{max-width:320px}
.rouside{width:280px;flex-shrink:0;display:flex;flex-direction:column;gap:10px;min-height:0;overflow-y:auto}

    if (a.dataset.act === 'play') pickGame(null);
  });
}

/* ===================== Game engine ===================== */
/* game.pool  = words not yet shown in this game (shuffled)
   game.used  = words already shown (when "no repeats" is on they wait here until the pool runs dry)
   game.queue = this round's working list; a passed word goes to the back of it */
let game = null;
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function startGame(deckIds) {
  const s = db.settings;
  const words = cleanWords(deckIds.map(getDeck).filter(Boolean).flatMap(k => k.words));
  if (!words.length) { toast('No words selected'); return; }
  game = { words, pool: shuffle(words.slice()), used: [], queue: [],
    teams: Array.from({ length: s.teams }, (_, i) => ({ name: s.teamNames[i] || `Team ${i + 1}`, score: 0 })),
    turn: 0, round: 1, phase: 'ready', current: null, got: [], passed: [], endAt: 0, timer: null, count: 3, lastTick: null };
  audio.unlock();
  keepAwake(true);
  if (db.settings.tilt && tilt.granted === null) tiltEnable();   // ask for motion access now, on the teacher's tap, not in front of the actor
  withParticipants(game, 'charades', 'Charades', game.teams.map(t => t.name), () => { if (location.hash === '#play') renderPlay(); else { navState.depth++; go('#play'); } });
}
function exitGame() { stopGame(); leaveTo('#setup'); }
/* Leave a play screen: back to the previous screen (normally the game's setup) */
function leaveTo(fallback) {
  if (navState.depth >= 1) { navState.depth -= 1; history.back(); }
  else { navState.depth = 0; location.replace(fallback); }
}
function refill() {
  const g = game;
  if (!g.pool.length) g.pool = shuffle(g.used.splice(0));
  if (!g.pool.length) g.pool = shuffle(g.words.slice());
  g.queue = g.pool.splice(0);
}
function nextWord() {
  const g = game;
  if (!g.queue.length) refill();
  g.current = g.queue.shift() || null;
  return g.current;
}
function markWord(ok) {
  const g = game; if (!g || !g.current) return;
  const w = g.current;
  if (ok) { g.got.push(w); g.teams[g.turn].score++; audio.ding(); }
  else { g.passed.push(w); audio.buzz(); }
  if (!ok && db.settings.allowPass) g.queue.push(w);       // comes back later this round
  else if (db.settings.avoidRepeats) g.used.push(w);        // parked until the pool is empty
  else g.pool.push(w);                                      // may show up again any time
  if (!ok && db.settings.allowPass && g.queue.length === 1 && g.queue[0] === w && g.pool.length) {
    g.queue = g.pool.splice(0).concat(g.queue);             // don't show the same word twice in a row
  }
  nextWord();
}
function endRound() {
  const g = game; clearInterval(g.timer); clearTimeout(g.timer); g.timer = null;
  if (g.current) { g.queue.unshift(g.current); g.current = null; }
  g.pool = g.queue.concat(g.pool); g.queue = [];             // unseen words go back to the pool
  g.phase = 'roundEnd';
  audio.horn();
  renderPlay();
}
function beginRound() {
  const g = game;
  g.got = []; g.passed = [];
  g.phase = 'countdown'; g.count = 3;
  renderPlay();
  const step = () => {
    if (!game || game.phase !== 'countdown') return;
    g.count--;
    if (g.count <= 0) { goWords(); } else { audio.tick(true); renderPlay(); g.timer = setTimeout(step, 800); }
  };
  audio.tick(true);
  g.timer = setTimeout(step, 800);
}
function goWords() {
  const g = game; clearTimeout(g.timer);
  g.phase = 'word'; if (tilt.on) tiltArm();
  nextWord();
  const secs = db.settings.roundSeconds;
  g.endAt = secs ? Date.now() + secs * 1000 : 0;
  g.lastTick = null;
  renderPlay();
  g.timer = setInterval(() => {
    if (!game || game.phase !== 'word') return;
    const ts = $('#tiltst'); if (ts) ts.textContent = tiltStatus();
    if (g.endAt) {
      const left = Math.max(0, g.endAt - Date.now());
      updateTimer(left, secs * 1000);
      const sec = Math.ceil(left / 1000);
      if (sec <= 5 && sec > 0 && g.lastTick !== sec) { g.lastTick = sec; audio.tick(); }
      if (left <= 0) endRound();
    }
  }, 100);
}
function updateTimer(left, total) {
  const bar = $('.timerbar i'), clock = $('.clock'), tb = $('.timerbar');
  if (bar) bar.style.width = (100 * left / total) + '%';
  if (clock) clock.textContent = fmt(left);
  if (tb) tb.classList.toggle('hot', left <= 10000);

/* ===================== Question engine (Quiz Show, Tic-tac-toe, Baamboozle, Snakes & Ladders) ===================== */
/* Turns deck entries into questions. Pairs "term | answer" ask one side and expect the other; plain words are

const PLAIN_MODES = { scramble: 'Unscramble the word', spell: 'Spell the word', sentence: 'Use the word in a sentence', translate: 'Say it in Spanish', define: 'Explain the word' };
function makeQuestions(words, cfg) {
  const side = cfg.side === 'term' ? 1 : 0;             // 0: show the term, answer is part 2; 1: show part 2, answer is the term
  const pool = shuffle(words.slice());
  const pairs = pool.filter(hasPair), plain = pool.filter(w => !hasPair(w));
  const qs = [];
  for (const w of pool) {
    const ps = parts(w);
    if (ps.length >= 3 && cfg.verbs !== false && /^[a-z]+$/i.test(ps[0]) && ps.slice(1).every(x => /^[a-z ,]+$/i.test(x))) {
      const others = shuffle(pairs.filter(x => x !== w && parts(x).length >= 3)).slice(0, 3).map(x => parts(x)[1] + ', ' + parts(x)[2]);
      qs.push({ q: 'Past simple and past participle of: ' + ps[0], a: ps[1] + ', ' + ps[2], options: shuffle([ps[1] + ', ' + ps[2]].concat(others)), kind: 'verb' });
    } else if (ps.length >= 2) {
      const q = side ? ps[1] : ps[0], a = side ? ps[0] : ps[1];
      const others = shuffle(pairs.filter(x => x !== w)).map(x => side ? parts(x)[0] : parts(x)[1]).filter(o => o && o.toLowerCase() !== a.toLowerCase());
      const seen = new Set([a.toLowerCase()]); const opts = [a];
      for (const o of others) { if (!seen.has(o.toLowerCase())) { seen.add(o.toLowerCase()); opts.push(o); } if (opts.length >= 4) break; }
      qs.push({ q, a, options: shuffle(opts), kind: 'pair' });
    } else {
      const mode = cfg.plain || 'scramble'; const word = ps[0];
      const others = shuffle(plain.filter(x => x !== w)).map(term).slice(0, 3);
      if (mode === 'scramble') qs.push({ q: 'Unscramble: ' + scramble(word).toUpperCase(), a: word, options: shuffle([word].concat(others)), kind: 'plain' });
      else if (mode === 'spell') qs.push({ q: 'Spell: ' + word, a: word.toUpperCase().split('').join(' '), options: null, kind: 'plain' });
      else if (mode === 'sentence') qs.push({ q: 'Use it in a sentence: ' + word, a: word, options: null, kind: 'plain' });
      else if (mode === 'translate') qs.push({ q: 'In Spanish: ' + word, a: '(teacher decides)', options: null, kind: 'plain' });

}

        <button class="btn big roubtn" data-act="spin" ${remaining.length ? '' : 'disabled'}>${remaining.length ? '🎯 Spin' : 'Everyone has been picked'}</button>
      </div>
      <div class="rouside">
        <div class="rouresult ${last ? 'show' : ''}">${last ? qAvatar(last, 'qnowav') + `<div class="qnowname">${esc(last.name)}</div>` : '<div class="qnowname" style="opacity:.6">Tap Spin</div>'}</div>
        <div class="qhead"><span>Still to pick</span><span class="qbadge">${remaining.length}</span></div>
        <div class="rouchips">${studs.map(s => `<span class="chip rouchip ${st.picked.includes(s.id) ? 'picked' : ''} ${st.excluded.includes(s.id) || absentToday.includes(s.id) ? 'absent' : ''}" data-stu="${s.id}">${esc(s.name)}${absentToday.includes(s.id) ? ' · absent today' : st.excluded.includes(s.id) ? ' · out' : st.picked.includes(s.id) ? ' ✓' : ''}</span>`).join('') || '<span class="hint">No students in this class yet. Add them in Queue → Teacher.</span>'}</div>

  $('.screen', app).addEventListener('click', async e => {
    const chip = e.target.closest('[data-stu]'); if (chip) { const id = chip.dataset.stu; if (st.excluded.includes(id)) st.excluded = st.excluded.filter(x => x !== id); else { st.excluded.push(id); st.picked = st.picked.filter(x => x !== id); } saveDb(); renderRoulette(); return; }
    const a = e.target.closest('[data-act]'); if (!a) return;

      const target = 360 * (5 + rnd(0, 2)) + (360 - (idx * seg + seg / 2)); // pointer at the top: rotate so the chosen segment's middle lands there

      $('.roubtn').disabled = true; let ticks = 0; const tk = setInterval(() => { audio.tick(true); if (++ticks > 30) clearInterval(tk); }, 130);
      setTimeout(() => { clearInterval(tk); st.picked.push(chosen.id); rouSpin.last = chosen.id; saveDb(); audio.ding(); speak(chosen.name, 'es-ES'); renderRoulette(); }, 4200);

/* ===================== Hangman ===================== */
let hang = null;

        <h2 class="sec">Game</h2>
        <div class="card">
          <div class="field"><label>Words per game</label>${segHtml('rounds', [[3, '3'], [5, '5'], [8, '8'], [10, '10']], cfg.rounds)}</div>
          ${togHtml('hint', 'Show a hint', 'The translation / definition when the word has one', cfg.hint)}

}
function startHang(selected) {
  const cfg = gameCfg('hangman'); const words = shuffle(wordsFrom(selected).filter(w => /^[a-z][a-z' -]{1,20}$/i.test(term(w))));
  if (!words.length) { toast('No suitable words (letters only, up to 21 characters)'); return; }
  hang = { cfg: JSON.parse(JSON.stringify(cfg)), words, i: -1, teams: makeTeams(cfg.teams), turn: 0, phase: 'word', word: '', hint: '', guessed: new Set(), wrong: 0, timer: null };
  hangNext();

}
function hangNext() { const h = hang; h.i++; if (h.i >= Math.min(h.cfg.rounds, h.words.length)) { h.phase = 'over'; return; } const w = h.words[h.i]; h.word = term(w); h.hint = parts(w)[1] || ''; h.guessed = new Set(); h.wrong = 0; h.phase = 'word'; h.solved = false; }
const HANG_PARTS = ['<circle cx="60" cy="24" r="8"/>', '<line x1="60" y1="32" x2="60" y2="58"/>', '<line x1="60" y1="40" x2="45" y2="52"/>', '<line x1="60" y1="40" x2="75" y2="52"/>', '<line x1="60" y1="58" x2="48" y2="76"/>', '<line x1="60" y1="58" x2="72" y2="76"/>', '<line x1="20" y1="10" x2="60" y2="10"/><line x1="60" y1="10" x2="60" y2="16"/>', '<line x1="20" y1="90" x2="20" y2="10"/><line x1="8" y1="90" x2="32" y2="90"/>'];
function renderHang() {

  else {
    const letters = h.word.toUpperCase().split('').map(ch => /[A-Z]/.test(ch) ? (h.guessed.has(ch) || h.solved || h.wrong >= 8 ? ch : '_') : ch);
    const order = [7, 6, 0, 1, 2, 3, 4, 5];  // gallows first, then the man
    const drawn = order.slice(0, h.wrong).map(i => HANG_PARTS[i]).join('');
    const done = h.solved || h.wrong >= 8;
    html = `<div class="play ready hm"><div class="ptop"><button data-p="exit">✕ Exit</button><span>Word ${h.i + 1} / ${Math.min(h.cfg.rounds, h.words.length)}${h.teams.length > 1 ? ' · ' + esc(h.teams[h.turn].name) : ''}</span><span class="clock">${8 - h.wrong} ❤</span></div>
      ${h.teams.length > 1 ? scoreboardHtml(h.teams, h.turn) : ''}

        <div class="hmword ${done ? (h.solved ? 'won' : 'lost') : ''}">${letters.map(l => `<span class="${l === '_' ? 'blank' : ''}">${l}</span>`).join('')}</div>
        ${h.cfg.hint && h.hint ? `<div class="t" style="opacity:.8">Hint: ${esc(h.hint)}</div>` : ''}
        ${done ? `<div class="t" style="font-size:22px;font-weight:800">${h.solved ? '🎉 ' + (h.teams.length > 1 ? esc(h.teams[h.turn].name) + ' gets ' + (8 - h.wrong) : 'Solved with ' + (8 - h.wrong) + ' lives left') : '💀 The word was ' + esc(h.word)}</div><button class="pbtn" data-p="next">Next word ›</button>`

      </div></div>`;
  }
  app.innerHTML = html;

    const h2 = hang; if (!h2) return;
    const k = e.target.closest('[data-key]');
    if (k && !h2.solved && h2.wrong < 8) {
      const ch = k.dataset.key; h2.guessed.add(ch);
      if (h2.word.toUpperCase().includes(ch)) { audio.tick(true); if (h2.word.toUpperCase().split('').every(c => !/[A-Z]/.test(c) || h2.guessed.has(c))) { h2.solved = true; h2.teams[h2.turn].score += 8 - h2.wrong; audio.ding(); } }
      else { h2.wrong++; audio.buzz(); if (h2.wrong >= 8) audio.horn(); else if (h2.teams.length > 1) h2.turn = (h2.turn + 1) % h2.teams.length; }

    if (act === 'exit') { if (h2.phase === 'over' || await confirmDlg('Leave the game?', '', 'Leave', true)) { hang = null; keepAwake(false); leaveTo('#hangman'); } }
    if (act === 'next') { if (h2.teams.length > 1) h2.turn = (h2.turn + 1) % h2.teams.length; hangNext(); renderHang(); }
    if (act === 'again') startHang(new Set(gameCfg('hangman').lastDecks));
  });
}

/* ===================== Timer (countdown / stopwatch) ===================== */
let tmr = { mode: 'down', total: 300000, left: 300000, running: false, at: 0, iv: null, elapsed: 0 };
function renderTimer() {
  const t = tmr;
  const ms = t.mode === 'down' ? t.left : t.elapsed; const s = Math.max(0, Math.ceil(ms / 1000)); const txt = `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
  app.innerHTML = `<div class="screen"><div class="play ready tm ${t.mode === 'down' && t.left <= 0 ? 'good' : ''}"><div class="ptop"><button data-nav="back" data-fallback="#home">✕ Close</button><span>${t.mode === 'down' ? 'Countdown' : 'Stopwatch'}</span><button data-p="mode">${t.mode === 'down' ? 'Stopwatch' : 'Countdown'}</button></div>
    <div class="center"><div class="bigtime">${txt}</div>
      ${t.mode === 'down' ? `<div class="seg" style="max-width:520px;width:100%">${[1, 2, 3, 5, 10, 15].map(m => `<button data-set="${m}" class="${t.total === m * 60000 ? 'on' : ''}">${m} min</button>`).join('')}</div>` : ''}
      <div class="bjudge" style="margin-top:18px"><button class="pbtn" data-p="startstop">${t.running ? '⏸ Pause' : '▶ Start'}</button><button class="pbtn ghost" data-p="reset">↺ Reset</button></div>
    </div></div></div>`;
  $('.screen', app).addEventListener('click', e => {
    const st = e.target.closest('[data-set]'); if (st) { tmrStop(); t.total = +st.dataset.set * 60000; t.left = t.total; renderTimer(); return; }
    const p = e.target.closest('[data-p]'); if (!p) return;
    if (p.dataset.p === 'mode') { tmrStop(); t.mode = t.mode === 'down' ? 'up' : 'down'; t.left = t.total; t.elapsed = 0; renderTimer(); }
    if (p.dataset.p === 'reset') { tmrStop(); t.left = t.total; t.elapsed = 0; renderTimer(); }
    if (p.dataset.p === 'startstop') { if (t.running) tmrStop(); else { audio.unlock(); t.running = true; t.at = Date.now(); keepAwake(true); t.iv = setInterval(() => { const now = Date.now(); const d = now - t.at; t.at = now; if (t.mode === 'down') { t.left -= d; if (t.left <= 0) { t.left = 0; tmrStop(); audio.horn(); setTimeout(() => audio.horn(), 700); } } else t.elapsed += d; const el = $('.bigtime'); if (el) { const ms2 = t.mode === 'down' ? t.left : t.elapsed; const s2 = Math.max(0, Math.ceil(ms2 / 1000)); el.textContent = `${Math.floor(s2 / 60)}:${String(s2 % 60).padStart(2, '0')}`; if (t.mode === 'down' && t.left <= 0) renderTimer(); } }, 200); } renderTimer(); }
  });
}
function tmrStop() { clearInterval(tmr.iv); tmr.iv = null; tmr.running = false; }

/* ===================== Players & rankings ===================== */
/* Before a game starts, the teacher can say which students are on which team (or skip). When the game ends,
   every student who played gets points: 3 for the winning team, 2 for second, 1 for everyone else who played
   (a single-team game gives everyone 2). Ties share the better rank. Points are only ever added. */
let activeGame = null;   // { id, title, obj, participants: [[studentIds per team]], recorded }
const RESULT_POINTS = rank => rank === 1 ? 3 : rank === 2 ? 2 : 1;
function withParticipants(obj, gameId, title, teamNames, go) {
  activeGame = { id: gameId, title, obj, participants: null, recorded: false };
  const g = currentClassGroup();
  if (!g || !g.students.length) { go(); return; }
  const n = teamNames.length; const assign = {};
  const m = openSheet(`<h3>Who is playing?</h3><p>Tap a name to put them in a team${n > 1 ? ' (tap again for the next team)' : ''}. Leave absent students unmarked. Points go to the students who play.</p>
    <div class="ptteams">${teamNames.map((t, i) => `<span class="ptteam" style="background:${TEAM_COLORS[i % 8]}">${i + 1} · ${esc(t)}</span>`).join('')}</div>
    <div class="ptchips" id="ptchips"></div>
    <div class="btnrow" style="margin-top:12px"><button class="btn sec" data-a="auto">Everyone, by turns</button><button class="btn sec" data-a="clear">Clear</button></div>
    <div class="btnrow" style="margin-top:10px"><button class="btn sec" data-a="skip">Play without students</button><button class="btn" data-a="start">Start</button></div>`);
  const absent = absencesFor(g.id);
  const draw = () => { $('#ptchips', m).innerHTML = g.students.map(s => { const t = assign[s.id]; const ab = absent.includes(s.id); return `<span class="chip ptchip ${t !== undefined ? 'on' : ''} ${ab ? 'absent' : ''}" data-s="${s.id}" style="${t !== undefined ? 'background:' + TEAM_COLORS[t % 8] + ';border-color:' + TEAM_COLORS[t % 8] + ';color:#fff' : ''}">${t !== undefined && n > 1 ? '<b>' + (t + 1) + '</b> ' : ''}${esc(s.name)}${ab && t === undefined ? ' · absent' : ''}</span>`; }).join(''); };
  draw();
  m.addEventListener('click', e => {
    const c = e.target.closest('[data-s]'); if (c) { const id = c.dataset.s; if (assign[id] === undefined) assign[id] = 0; else if (assign[id] + 1 < n) assign[id]++; else delete assign[id]; draw(); return; }
    const a = e.target.dataset.a; if (!a) return;
    if (a === 'auto') { shuffle(g.students.filter(s => !absent.includes(s.id))).forEach((s, i) => { assign[s.id] = i % n; }); draw(); return; }
    if (a === 'clear') { for (const k in assign) delete assign[k]; draw(); return; }
    closeSheet(m);
    if (a === 'start') { const parts = teamNames.map(() => []); for (const [sid, t] of Object.entries(assign)) parts[t].push(sid); if (parts.some(p => p.length)) activeGame.participants = parts; }
    go();
  });
}
function recordResult(teams) {
  const ag = activeGame; if (!ag || ag.recorded || !ag.participants) return null;
  ag.recorded = true;

  const order = teams.map((t, i) => ({ i, score: t.score })).sort((a, b) => b.score - a.score);
  const ranks = {}; order.forEach((o, k) => { ranks[o.i] = k > 0 && o.score === order[k - 1].score ? ranks[order[k - 1].i] : k + 1; });
  const res = { ts: Date.now(), cls: g.id, clsName: g.name, grade: classGrade(), game: ag.id, title: ag.title, teams: teams.map((t, i) => ({ name: t.name, score: t.score, rank: teams.length > 1 ? ranks[i] : 1, pts: teams.length > 1 ? RESULT_POINTS(ranks[i]) : 2, students: ag.participants[i] || [] })) };
  if (!Array.isArray(db.results)) db.results = [];
  db.results.push(res); if (db.results.length > 2000) db.results = db.results.slice(-2000);

}
function studentName(sid) { for (const g of db.queue.groups) { const s = g.students.find(x => x.id === sid); if (s) return { s, g }; } return null; }
function rankings(scope, gameId) {
  const g = currentClassGroup(); if (!g) return [];

  for (const r of rows) for (const t of r.teams) for (const sid of t.students) { const a = acc[sid] || (acc[sid] = { sid, pts: 0, games: 0, wins: 0 }); a.pts += t.pts; a.games++; if (t.rank === 1 && r.teams.length > 1) a.wins++; }

}

/* ===================== Absences → Attendance app (via Telegram) ===================== */
/* The Attendance app on the PC reads Telegram messages like "Ana, Luis (3)" = absent today in group 3.
   The iPad builds that message and opens Telegram with it; the teacher taps Send. Absences are also kept
   here so the roulette and the "who is playing" sheet leave absent students out. */
const todayKey = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };

const AUTH = { key: 'classGames.auth', salt: 'classgames-v1', iterations: 100000, days: 30, hash: 'f5747d8cd2c8d481d370bc6798242cbae120b6ed6916bbb7c82309143862b9b2' };
const DEV_BYPASS = /selftest|demo=|dev=/.test(location.search);
function isUnlocked() { try { const a = JSON.parse(localStorage.getItem(AUTH.key) || 'null'); return !!(a && a.until > Date.now()); } catch (e) { return false; } }
function setUnlocked(remember) { try { localStorage.setItem(AUTH.key, JSON.stringify({ until: Date.now() + (remember ? AUTH.days : 0.5) * 86400000 })); } catch (e) {} }
async function checkLogin(u, p) {
  try {
    const enc = new TextEncoder();
    const key = await crypto.subtle.importKey('raw', enc.encode(String(u).trim().toLowerCase() + ':' + p), 'PBKDF2', false, ['deriveBits']);
    const bits = await crypto.subtle.deriveBits({ name: 'PBKDF2', salt: enc.encode(AUTH.salt), iterations: AUTH.iterations, hash: 'SHA-256' }, key, 256);
    return [...new Uint8Array(bits)].map(b => b.toString(16).padStart(2, '0')).join('') === AUTH.hash;
  } catch (e) { toast('Sign-in needs a secure (https) connection'); return false; }
}
